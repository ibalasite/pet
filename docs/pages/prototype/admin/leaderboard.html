<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>排行榜管理 · Pixel Pet Arena Admin</title>
  <link rel="stylesheet" href="assets/admin-style.css" />
</head>
<body>
<header class="admin-topnav">
  <a href="../../../index.html" class="back-link">← 文件站</a>
  <span class="topnav-title">🛡️ Pixel Pet Arena Admin</span>
  <div class="topnav-right">
    <span class="current-user" id="currentUserLabel"></span>
    <button class="logout-btn" onclick="location.href='admin-login.html'">登出</button>
  </div>
</header>
<div id="sidebarContainer"></div>

<main class="admin-main">
  <div class="page-header">
    <h1 class="page-title">🏆 排行榜管理</h1>
    <span class="page-subtitle">Top 500 · 移除異常條目</span>
  </div>

  <div class="panel" style="margin-bottom:16px;">
    <span style="color:var(--admin-text-dim);font-size:13px;">
      🟠 橙色高亮 = 系統偵測可疑條目（suspicious=true）
    </span>
  </div>

  <table class="data-table">
    <thead>
      <tr>
        <th>排名</th><th>寵物名稱</th><th>稀有度</th><th>擁有者</th>
        <th>Arena 分數</th><th>勝率</th><th>狀態</th><th>操作</th>
      </tr>
    </thead>
    <tbody id="leaderboardBody"></tbody>
  </table>
</main>

<!-- Confirm Remove Modal -->
<div class="modal-overlay" id="removeModal">
  <div class="modal-card">
    <h3>⚠️ 確認移除排名</h3>
    <p class="modal-desc">此操作將從公開排行榜移除該條目，並寫入稽核記錄。是否繼續？</p>
    <div id="removeTarget" style="margin-bottom:12px;font-size:13px;color:var(--admin-text-dim);"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('removeModal')">取消</button>
      <button class="btn btn-danger" onclick="confirmRemove()">確認移除</button>
    </div>
  </div>
</div>

<script src="assets/admin-mock.js"></script>
<script>
  /* leaderboard state — cloned so mutations don't affect source */
  var leaderboard = (ADMIN_MOCK.leaderboard || []).map(function (p) { return Object.assign({}, p); });
  var removeTargetIdx = null;

  function init() {
    var u = ADMIN_MOCK.currentUser;
    var labelEl = document.getElementById('currentUserLabel');
    if (labelEl) { labelEl.textContent = u.username + ' (' + roleDisplayName(u.role) + ')'; }
    var sidebar = document.getElementById('sidebarContainer');
    if (sidebar) { sidebar.replaceWith(renderSidebar('leaderboard')); }
    renderTable();
  }

  function renderTable() {
    var u = ADMIN_MOCK.currentUser;
    var canMutate = u.role === 'super_admin' || u.role === 'moderator';
    var tbody = document.getElementById('leaderboardBody');
    if (!tbody) { return; }

    if (leaderboard.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--admin-text-dim);padding:32px;">排行榜為空</td></tr>';
      return;
    }

    tbody.innerHTML = leaderboard.map(function (p, idx) {
      /* idx is a plain integer — safe to embed directly in onclick */
      var rowClass = p.suspicious ? ' class="row-suspicious"' : '';
      var suspBadge = p.suspicious
        ? '<span class="status-badge flagged">⚠ 可疑</span>'
        : '<span class="status-badge active">正常</span>';
      var actions = '';
      if (canMutate) {
        actions += '<button class="icon-btn danger" onclick="openRemoveModal(' + idx + ')">移除排名</button>';
      }
      var rankMedal = p.rank === 1 ? '🥇' : p.rank === 2 ? '🥈' : p.rank === 3 ? '🥉' : '#' + p.rank;
      return '<tr' + rowClass + '>'
        + '<td><strong>' + rankMedal + '</strong></td>'
        + '<td><strong>' + escapeHtml(p.pet_name) + '</strong></td>'
        + '<td>' + escapeHtml(p.rarity) + '</td>'
        + '<td class="mono">' + escapeHtml(p.owner) + '</td>'
        + '<td>' + escapeHtml(String(p.arena_score)) + '</td>'
        + '<td>' + escapeHtml(String(p.win_rate)) + '%</td>'
        + '<td>' + suspBadge + '</td>'
        + '<td><div class="action-cell">' + actions + '</div></td>'
        + '</tr>';
    }).join('');
  }

  function openRemoveModal(idx) {
    /* validate idx is a valid array index */
    if (typeof idx !== 'number' || idx < 0 || idx >= leaderboard.length) { return; }
    removeTargetIdx = idx;
    var p = leaderboard[idx];
    var el = document.getElementById('removeTarget');
    if (el) { el.textContent = '目標：#' + p.rank + ' ' + p.pet_name + '（Arena 分數：' + p.arena_score + '）'; }
    openModal('removeModal');
  }

  function confirmRemove() {
    if (removeTargetIdx === null || removeTargetIdx < 0 || removeTargetIdx >= leaderboard.length) {
      closeModal('removeModal');
      return;
    }
    var p = leaderboard[removeTargetIdx];
    leaderboard.splice(removeTargetIdx, 1);
    /* re-rank remaining entries */
    leaderboard.forEach(function (item, i) { item.rank = i + 1; });
    removeTargetIdx = null;
    closeModal('removeModal');
    renderTable();
    showToast('已移除排名：' + p.pet_name, 'success');
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
