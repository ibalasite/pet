<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>稽核日誌 · Pixel Pet Arena Admin</title>
  <link rel="stylesheet" href="assets/admin-style.css" />
</head>
<body>
<header class="admin-topnav">
  <a href="../../index.html" class="back-link">← 文件站</a>
  <span class="topnav-title">🛡️ Pixel Pet Arena Admin</span>
  <div class="topnav-right">
    <span class="current-user" id="currentUserLabel"></span>
    <button class="logout-btn" onclick="location.href='admin-login.html'">登出</button>
  </div>
</header>
<div id="sidebarContainer"></div>

<main class="admin-main" id="mainContent">
  <div class="page-header">
    <h1 class="page-title">📜 稽核日誌</h1>
    <button class="btn btn-primary" onclick="exportCSV()">⬇ 匯出 CSV</button>
  </div>

  <div class="search-bar" style="grid-template-columns:1fr 1fr 1fr auto;">
    <input id="searchInput" class="form-input" type="text" placeholder="搜尋操作員 / 動作 / 對象…" oninput="renderTable()" />
    <select id="operatorFilter" class="form-select" onchange="renderTable()">
      <option value="">所有操作員</option>
    </select>
    <select id="actionFilter" class="form-select" onchange="renderTable()">
      <option value="">所有動作類型</option>
      <option value="pet:ban">pet:ban</option>
      <option value="pet:unban">pet:unban</option>
      <option value="battle:flag">battle:flag</option>
      <option value="battle:unflag">battle:unflag</option>
      <option value="leaderboard:remove">leaderboard:remove</option>
      <option value="config:runtime:update">config:runtime:update</option>
      <option value="config:economy:update">config:economy:update</option>
      <option value="config:flags:update">config:flags:update</option>
      <option value="gdpr:process">gdpr:process</option>
      <option value="gdpr:complete">gdpr:complete</option>
    </select>
    <button class="btn btn-primary" onclick="renderTable()">篩選</button>
  </div>

  <table class="data-table">
    <thead>
      <tr>
        <th>ID</th><th>操作員</th><th>動作</th><th>對象</th><th>IP（masked）</th><th>時間</th><th>結果</th>
      </tr>
    </thead>
    <tbody id="auditBody"></tbody>
  </table>
  <div class="pagination" id="paginationWrap"></div>
</main>

<!-- 403 for non-super_admin -->
<div id="forbiddenBanner" style="display:none;padding:48px 32px;text-align:center;">
  <div style="font-size:64px;">🔒</div>
  <h2 style="margin:16px 0 8px;">存取受限</h2>
  <p style="color:var(--admin-text-dim);">稽核日誌僅限 super_admin 存取</p>
  <a href="admin-dashboard.html" class="btn btn-primary" style="margin-top:16px;display:inline-flex;">返回控制台</a>
</div>

<script src="assets/admin-mock.js"></script>
<script>
  var logs = (ADMIN_MOCK.auditLogs || []).map(function (l) { return Object.assign({}, l); });
  var PAGE_SIZE = 20;
  var currentPage = 1;

  function init() {
    var u = ADMIN_MOCK.currentUser;
    var labelEl = document.getElementById('currentUserLabel');
    if (labelEl) { labelEl.textContent = u.username + ' (' + roleDisplayName(u.role) + ')'; }
    var sidebar = document.getElementById('sidebarContainer');
    if (sidebar) { sidebar.innerHTML = renderSidebar('audit'); }

    if (u.role !== 'super_admin') {
      var main = document.getElementById('mainContent');
      var banned = document.getElementById('forbiddenBanner');
      if (main) { main.style.display = 'none'; }
      if (banned) { banned.style.display = 'block'; }
      return;
    }

    /* Populate operator filter */
    var ops = [];
    logs.forEach(function (l) {
      if (ops.indexOf(l.operator) === -1) { ops.push(l.operator); }
    });
    var opSel = document.getElementById('operatorFilter');
    if (opSel) {
      ops.forEach(function (op) {
        var opt = document.createElement('option');
        opt.value = op;
        opt.textContent = op;
        opSel.appendChild(opt);
      });
    }

    renderTable();
  }

  function safeStr(v) { return v == null ? '' : String(v); }

  function filtered() {
    var q = (document.getElementById('searchInput').value || '').toLowerCase();
    var op = document.getElementById('operatorFilter').value;
    var action = document.getElementById('actionFilter').value;
    return logs.filter(function (l) {
      var matchQ = !q
        || safeStr(l.operator).toLowerCase().indexOf(q) !== -1
        || safeStr(l.action).toLowerCase().indexOf(q) !== -1
        || safeStr(l.target).toLowerCase().indexOf(q) !== -1;
      var matchOp = !op || l.operator === op;
      var matchA = !action || l.action === action;
      return matchQ && matchOp && matchA;
    });
  }

  function renderTable() {
    var data = filtered();
    var start = (currentPage - 1) * PAGE_SIZE;
    var page = data.slice(start, start + PAGE_SIZE);
    var tbody = document.getElementById('auditBody');
    if (!tbody) { return; }

    if (page.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--admin-text-dim);padding:32px;">無符合條件的稽核記錄</td></tr>';
      renderPagination(0);
      return;
    }

    tbody.innerHTML = page.map(function (l) {
      var resultClass = l.result === 'success' ? 'success' : 'failed';
      return '<tr>'
        + '<td class="mono">' + escapeHtml(String(l.id)) + '</td>'
        + '<td>' + escapeHtml(l.operator) + '</td>'
        + '<td><code style="font-size:11px;color:var(--admin-accent);">' + escapeHtml(l.action) + '</code></td>'
        + '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escapeHtml(l.target) + '</td>'
        + '<td class="mono">' + escapeHtml(l.ip) + '</td>'
        + '<td>' + escapeHtml(l.ts) + '</td>'
        + '<td><span class="status-badge ' + resultClass + '">' + escapeHtml(l.result) + '</span></td>'
        + '</tr>';
    }).join('');

    renderPagination(data.length);
  }

  function renderPagination(total) {
    var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    var wrap = document.getElementById('paginationWrap');
    if (!wrap) { return; }
    var btns = '<button onclick="goPage(' + Math.max(1, currentPage - 1) + ')">‹</button>';
    for (var i = 1; i <= totalPages; i++) {
      btns += '<span class="page-num' + (i === currentPage ? ' active' : '') + '" onclick="goPage(' + i + ')">' + i + '</span>';
    }
    btns += '<button onclick="goPage(' + Math.min(totalPages, currentPage + 1) + ')">›</button>';
    btns += '<span class="pagination-info">共 ' + total + ' 筆</span>';
    wrap.innerHTML = btns;
  }

  function goPage(n) { currentPage = n; renderTable(); }

  function exportCSV() {
    var data = filtered();
    var header = ['ID', 'Operator', 'Action', 'Target', 'IP', 'Timestamp', 'Result'];
    var rows = [header].concat(data.map(function (l) {
      return [l.id, l.operator, l.action, l.target, l.ip, l.ts, l.result];
    }));
    downloadCSV('audit-log-' + new Date().toISOString().slice(0, 10) + '.csv', rows);
    showToast('CSV 匯出成功', 'success');
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
