<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>控制台 · Pixel Pet Arena Admin</title>
  <link rel="stylesheet" href="assets/admin-style.css" />
  <style>
    .quick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .quick-card {
      background: var(--admin-surface);
      border: 1px solid var(--admin-border);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .quick-card .q-title { font-size: 13px; color: var(--admin-text-dim); }
    .quick-card .q-value { font-size: 28px; font-weight: 700; }
    .quick-card a.q-link { font-size: 12px; color: var(--admin-accent); margin-top: auto; }
    .action-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .action-chip {
      padding: 8px 16px;
      background: var(--admin-surface);
      border: 1px solid var(--admin-border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--admin-text);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .action-chip:hover { background: var(--admin-accent); border-color: var(--admin-accent); color: #fff; }
    .action-chip.warn:hover { background: var(--admin-warning); border-color: var(--admin-warning); color: #000; }
    .action-chip.danger:hover { background: var(--admin-danger); border-color: var(--admin-danger); color: #fff; }
  </style>
</head>
<body>
<header class="admin-topnav">
  <a href="../../index.html" class="back-link">← 文件站</a>
  <span class="topnav-title">🛡️ Pixel Pet Arena Admin</span>
  <div class="topnav-right">
    <span class="current-user" id="currentUserLabel"></span>
    <button class="logout-btn" onclick="location.href='admin-login.html'">登出</button>
  </div>
</header>

<div id="sidebarContainer"></div>

<main class="admin-main">
  <div class="page-header">
    <h1 class="page-title">📊 控制台</h1>
    <span class="page-subtitle" id="lastRefresh"></span>
  </div>

  <!-- KPI 卡片 -->
  <section class="stats-grid" id="statsGrid"></section>

  <!-- 快速操作 -->
  <section class="panel">
    <div class="panel-header"><h2 class="panel-title">⚡ 快速操作</h2></div>
    <div class="action-chips" id="actionChips"></div>
  </section>

  <!-- 最近稽核活動 -->
  <section class="panel">
    <div class="panel-header">
      <h2 class="panel-title">📜 最近稽核活動</h2>
      <a href="admin-audit-log.html" class="panel-link" id="auditLinkWrap">完整日誌 →</a>
    </div>
    <table class="data-table" id="recentAuditTable">
      <thead>
        <tr>
          <th>操作員</th>
          <th>動作</th>
          <th>對象</th>
          <th>IP</th>
          <th>時間</th>
          <th>結果</th>
        </tr>
      </thead>
      <tbody id="recentAuditBody"></tbody>
    </table>
  </section>
</main>

<script src="assets/admin-mock.js"></script>
<script>
  function init() {
    var u = ADMIN_MOCK.currentUser;
    var roleClass = roleColorClass(u.role);
    var roleLabel = roleDisplayName(u.role);

    document.getElementById('currentUserLabel').textContent = u.username + ' (' + roleLabel + ')';
    document.getElementById('sidebarContainer').innerHTML = renderSidebar('dashboard');
    document.getElementById('lastRefresh').textContent = '最後更新：' + ADMIN_MOCK.stats.last_refresh;

    renderStats();
    renderActionChips();
    renderRecentAudit();
  }

  function renderStats() {
    var s = ADMIN_MOCK.stats;
    var u = ADMIN_MOCK.currentUser;
    var isSuperAdmin = u.role === 'super_admin';

    var cards = [
      { title: '活躍寵物數', value: s.active_pets.toLocaleString(), trend: '↑ 2.3%', trendClass: 'trend-up', icon: '🐾' },
      { title: '今日 Claim 數', value: s.claims_today.toLocaleString(), trend: '↑ 18.4%', trendClass: 'trend-up', icon: '📥' },
      { title: '今日戰鬥數', value: s.battles_today.toLocaleString(), trend: '↑ 5.1%', trendClass: 'trend-up', icon: '⚔️' },
      { title: '今日可疑 Bot', value: s.suspicious_today, trend: s.suspicious_today > 3 ? '⚠ 偏高' : '正常', trendClass: s.suspicious_today > 3 ? 'trend-down' : 'trend-flat', icon: '🚨' },
    ];

    if (isSuperAdmin) {
      cards.push({ title: 'GDPR 待處理', value: s.gdpr_pending, trend: s.gdpr_pending > 0 ? '需處理' : '清空', trendClass: s.gdpr_pending > 0 ? 'trend-down' : 'trend-up', icon: '🔐' });
    }

    cards.push({ title: 'Email 成功率', value: s.email_success_rate + '%', trend: '正常', trendClass: 'trend-up', icon: '📧' });

    var grid = document.getElementById('statsGrid');
    grid.innerHTML = cards.map(function (c) {
      return '<div class="stats-card">'
        + '<div class="stat-title">' + escapeHtml(c.icon + ' ' + c.title) + '</div>'
        + '<div class="stat-number">' + escapeHtml(String(c.value)) + '</div>'
        + '<span class="stat-trend ' + c.trendClass + '">' + escapeHtml(c.trend) + '</span>'
        + '</div>';
    }).join('');
  }

  function renderActionChips() {
    var u = ADMIN_MOCK.currentUser;
    var isSuperAdmin = u.role === 'super_admin';
    var isMod = isSuperAdmin || u.role === 'moderator';

    var chips = [
      { label: '🚨 查看可疑活動 (' + ADMIN_MOCK.stats.suspicious_today + ')', href: 'suspicious.html', cls: 'danger', show: isMod },
      { label: '⚔️ 已旗標戰鬥', href: 'battles.html?filter=flagged', cls: 'warn', show: true },
      { label: '🔐 GDPR 佇列 (' + ADMIN_MOCK.stats.gdpr_pending + ')', href: 'gdpr.html', cls: 'danger', show: isSuperAdmin },
      { label: '🐾 寵物管理', href: 'pets.html', cls: '', show: true },
      { label: '🏆 排行榜', href: 'leaderboard.html', cls: '', show: true },
      { label: '📈 Analytics', href: 'analytics.html', cls: '', show: true },
    ];

    var container = document.getElementById('actionChips');
    container.innerHTML = chips.filter(function (c) { return c.show; }).map(function (c) {
      return '<a href="' + escapeHtml(c.href) + '" class="action-chip ' + c.cls + '">' + escapeHtml(c.label) + '</a>';
    }).join('');

    /* Audit log link only for super_admin */
    var auditLink = document.getElementById('auditLinkWrap');
    if (auditLink && u.role !== 'super_admin') { auditLink.style.display = 'none'; }
  }

  function renderRecentAudit() {
    var logs = ADMIN_MOCK.auditLogs.slice(0, 5);
    var tbody = document.getElementById('recentAuditBody');
    tbody.innerHTML = logs.map(function (l) {
      var resultClass = l.result === 'success' ? 'success' : 'failed';
      return '<tr>'
        + '<td>' + escapeHtml(l.operator) + '</td>'
        + '<td><code>' + escapeHtml(l.action) + '</code></td>'
        + '<td>' + escapeHtml(l.target) + '</td>'
        + '<td class="mono">' + escapeHtml(l.ip) + '</td>'
        + '<td>' + escapeHtml(l.ts) + '</td>'
        + '<td><span class="status-badge ' + resultClass + '">' + escapeHtml(l.result) + '</span></td>'
        + '</tr>';
    }).join('');
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
