<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Pixel Pet Arena Admin</title>
  <link href="assets/admin-style.css" rel="stylesheet">
</head>
<body>

<!-- Top Nav -->
<header class="admin-topnav">
  <div class="topnav-brand">🛡️ <span>Pixel Pet Arena</span> Admin</div>
  <nav class="topnav-actions">
    <a href="../../index.html" class="back-link">← 文件站</a>
    <span class="topnav-user">👤 Super Admin</span>
    <button class="btn btn-sm btn-secondary" id="logoutBtn">登出</button>
  </nav>
</header>

<!-- Layout -->
<div class="admin-layout">
  <div id="sidebarMount"></div>

  <main class="admin-main">
    <div class="page-header">
      <div>
        <h1 class="page-title">Dashboard</h1>
        <p class="page-subtitle">平台即時概覽 — 2026-05-18</p>
      </div>
      <button class="btn btn-secondary btn-sm" id="refreshBtn">🔄 重新整理</button>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid" id="statsGrid"></div>

    <!-- Quick Actions -->
    <div class="card" style="margin-bottom:1.5rem">
      <div class="card-header">
        <h2>快速操作</h2>
      </div>
      <div class="quick-actions">
        <button class="btn btn-primary"   data-href="admin-users.html">👥 使用者管理</button>
        <button class="btn btn-secondary" data-href="admin-roles.html">🗝️ 角色管理</button>
        <button class="btn btn-secondary" data-href="admin-audit-log.html">📜 稽核日誌</button>
        <button class="btn btn-ghost" style="color:var(--admin-warning)" data-href="admin-audit-log.html">⚠️ 可疑活動 (3)</button>
      </div>
    </div>

    <!-- Recent Audit Log -->
    <div class="card">
      <div class="card-header">
        <h2>最近操作記錄</h2>
        <a href="admin-audit-log.html" style="font-size:13px">查看全部 →</a>
      </div>
      <div class="data-table-wrap">
        <table>
          <thead>
            <tr>
              <th>時間</th>
              <th>操作員</th>
              <th>動作</th>
              <th>目標</th>
              <th>詳情</th>
            </tr>
          </thead>
          <tbody id="recentAuditBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Platform Health -->
    <div class="card">
      <div class="card-header">
        <h3>平台健康指標</h3>
        <span class="status-badge active">All Systems Operational</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem">
        <div style="padding:1rem;background:#f9fafb;border-radius:8px;text-align:center">
          <div style="font-size:24px;font-weight:700;color:#10b981">99.9%</div>
          <div style="font-size:12px;color:var(--admin-text-muted);margin-top:4px">API Uptime</div>
        </div>
        <div style="padding:1rem;background:#f9fafb;border-radius:8px;text-align:center">
          <div style="font-size:24px;font-weight:700;color:#2d9ef5">142ms</div>
          <div style="font-size:12px;color:var(--admin-text-muted);margin-top:4px">Avg Response Time</div>
        </div>
        <div style="padding:1rem;background:#f9fafb;border-radius:8px;text-align:center">
          <div style="font-size:24px;font-weight:700;color:#f59e0b">98.2%</div>
          <div style="font-size:12px;color:var(--admin-text-muted);margin-top:4px">Email Delivery Rate</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="assets/admin-mock.js"></script>
<script>
(function () {
  'use strict';

  /* ── Safe navigation (allowlist only) ───────────────────── */
  const SAFE_PAGES = {
    'admin-users.html':     'admin-users.html',
    'admin-roles.html':     'admin-roles.html',
    'admin-audit-log.html': 'admin-audit-log.html',
    'admin-login.html':     'admin-login.html',
    'admin-dashboard.html': 'admin-dashboard.html'
  };
  function safeNav(page) {
    const target = SAFE_PAGES[page];
    if (target) location.href = target;
  }

  /* ── Guard ──────────────────────────────────────────────── */
  if (typeof ADMIN_MOCK === 'undefined' || typeof renderSidebar === 'undefined') {
    console.error('admin-mock.js not loaded');
    return;
  }

  /* ── Sidebar — renderSidebar() returns an HTMLElement node ─ */
  const sidebarMount = document.getElementById('sidebarMount');
  if (sidebarMount && sidebarMount.parentNode) {        // guard: parentNode may be null on detached DOM
    const sidebarNode = renderSidebar('dashboard');     // returns HTMLElement
    sidebarMount.parentNode.replaceChild(sidebarNode, sidebarMount);
  }

  /* ── Wire static buttons ────────────────────────────────── */
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) logoutBtn.addEventListener('click', function () { safeNav('admin-login.html'); });

  const refreshBtn = document.getElementById('refreshBtn');
  if (refreshBtn) refreshBtn.addEventListener('click', function () { location.reload(); });

  document.querySelectorAll('[data-href]').forEach(function (btn) {
    btn.addEventListener('click', function () { safeNav(btn.getAttribute('data-href')); });
  });

  /* ── Stats Grid — all text via textContent ──────────────── */
  const s = ADMIN_MOCK.stats;
  if (!s) { console.error('ADMIN_MOCK.stats missing'); return; }

  const statsData = [
    { icon: '👥', label: 'Admin 使用者', value: s.total_users,                       meta: s.active_users + ' 活躍 / ' + s.locked_users + ' 鎖定' },
    { icon: '🐾', label: '總寵物數',     value: Number(s.total_pets).toLocaleString(), meta: '累積寵物檔案' },
    { icon: '⚔️', label: '今日戰鬥',     value: s.battles_today,                      meta: '戰鬥場次 (今日)' },
    { icon: '⚠️', label: '可疑標記',     value: s.suspicious_flags,                   meta: '等待審查' }
  ];

  const grid = document.getElementById('statsGrid');
  if (grid) {
    statsData.forEach(function (d) {
      // Build entirely with DOM API — no innerHTML
      const card  = document.createElement('div');  card.className  = 'stat-card';
      const ico   = document.createElement('div');  ico.className   = 'stat-icon';   ico.textContent  = d.icon;
      const lbl   = document.createElement('div');  lbl.className   = 'stat-label';  lbl.textContent  = d.label;
      const val   = document.createElement('div');  val.className   = 'stat-value';  val.textContent  = String(d.value === null || d.value === undefined ? '' : d.value);
      const meta  = document.createElement('div');  meta.className  = 'stat-meta';   meta.textContent = d.meta;
      card.appendChild(ico); card.appendChild(lbl); card.appendChild(val); card.appendChild(meta);
      grid.appendChild(card);
    });
  }

  /* ── Recent Audit (top 5) — DOM construction throughout ─── */
  const tbody = document.getElementById('recentAuditBody');
  const logs  = ADMIN_MOCK.auditLogs;
  if (tbody && Array.isArray(logs)) {
    logs.slice(0, 5).forEach(function (log) {
      const tr = document.createElement('tr');

      // ts
      const tdTs = document.createElement('td');
      tdTs.className = 'font-mono text-muted'; tdTs.style.whiteSpace = 'nowrap';
      tdTs.textContent = log.ts;

      // actor
      const tdActor = document.createElement('td');
      const strong  = document.createElement('strong');
      strong.textContent = log.actor;
      tdActor.appendChild(strong);

      // action — actionTag() returns HTMLElement; fallback to textContent if unavailable
      const tdAction = document.createElement('td');
      if (typeof actionTag === 'function') {
        const tagNode = actionTag(log.action);
        if (tagNode instanceof HTMLElement) {
          tdAction.appendChild(tagNode);
        } else {
          tdAction.textContent = String(log.action || '');
        }
      } else {
        tdAction.textContent = String(log.action || '');
      }

      // target
      const tdTarget = document.createElement('td');
      tdTarget.className = 'font-mono'; tdTarget.textContent = log.target;

      // detail
      const tdDetail = document.createElement('td');
      tdDetail.className = 'text-muted';
      tdDetail.style.cssText = 'max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
      tdDetail.textContent = log.detail;

      tr.appendChild(tdTs); tr.appendChild(tdActor); tr.appendChild(tdAction);
      tr.appendChild(tdTarget); tr.appendChild(tdDetail);
      tbody.appendChild(tr);
    });
  }
}());
</script>
</body>
</html>
