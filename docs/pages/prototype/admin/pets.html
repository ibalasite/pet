<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>寵物管理 · Pixel Pet Arena Admin</title>
  <link rel="stylesheet" href="assets/admin-style.css" />
</head>
<body>
<header class="admin-topnav">
  <a href="../../../index.html" class="back-link">← 文件站</a>
  <span class="topnav-title">🛡️ Pixel Pet Arena Admin</span>
  <div class="topnav-right">
    <span class="current-user" id="currentUserLabel"></span>
    <button class="logout-btn" onclick="location.href='admin-login.html'">登出</button>
  </div>
</header>
<div id="sidebarContainer"></div>

<main class="admin-main">
  <div class="page-header">
    <h1 class="page-title">🐾 寵物管理</h1>
    <span class="page-subtitle">Ban / Unban 寵物帳號</span>
  </div>

  <div class="search-bar" style="grid-template-columns:2fr 1fr 1fr auto;">
    <input id="searchInput" class="form-input" type="text" placeholder="搜尋 Pet ID / 名稱…" oninput="renderTable()" />
    <select id="rarityFilter" class="form-select" onchange="renderTable()">
      <option value="">所有稀有度</option>
      <option>Common</option><option>Rare</option><option>Epic</option><option>Legendary</option>
    </select>
    <select id="statusFilter" class="form-select" onchange="renderTable()">
      <option value="">所有狀態</option>
      <option value="active">Active</option>
      <option value="banned">Banned</option>
    </select>
    <button class="btn btn-primary" onclick="renderTable()">搜尋</button>
  </div>

  <table class="data-table">
    <thead>
      <tr>
        <th>Pet ID</th><th>名稱</th><th>稀有度</th><th>等級</th>
        <th>擁有者 Email</th><th>狀態</th><th>建立時間</th><th>操作</th>
      </tr>
    </thead>
    <tbody id="petsBody"></tbody>
  </table>
  <div class="pagination" id="paginationWrap"></div>
</main>

<!-- Ban Modal -->
<div class="modal-overlay" id="banModal">
  <div class="modal-card">
    <h3>🚫 Ban 寵物</h3>
    <p class="modal-desc">請輸入 Ban 原因（必填，最多 500 字）</p>
    <div id="banTargetInfo" style="margin-bottom:10px;font-size:13px;color:var(--admin-text-dim);"></div>
    <div class="form-group">
      <label>Ban 原因</label>
      <textarea id="banReasonInput" class="form-textarea" rows="4" maxlength="500" placeholder="請說明 ban 的具體原因…"></textarea>
      <div style="text-align:right;font-size:11px;color:var(--admin-text-dim);margin-top:4px;">
        <span id="banReasonCount">0</span> / 500
      </div>
    </div>
    <div id="banReasonError" class="error-msg" style="display:none;">請填寫 Ban 原因</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('banModal')">取消</button>
      <button class="btn btn-danger" onclick="confirmBan()">確認 Ban</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-card" style="max-width:520px;">
    <h3>🔍 寵物詳情</h3>
    <div id="detailContent"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('detailModal')">關閉</button>
    </div>
  </div>
</div>

<script src="assets/admin-mock.js"></script>
<script>
  var pets = ADMIN_MOCK.pets.map(function (p) { return Object.assign({}, p); });
  var banTargetId = null;
  var PAGE_SIZE = 20;
  var currentPage = 1;

  function init() {
    var u = ADMIN_MOCK.currentUser;
    document.getElementById('currentUserLabel').textContent = u.username + ' (' + roleDisplayName(u.role) + ')';
    var sc = document.getElementById('sidebarContainer'); if (sc) { sc.replaceWith(renderSidebar('pets')); }

    var textarea = document.getElementById('banReasonInput');
    if (textarea) {
      textarea.addEventListener('input', function () {
        document.getElementById('banReasonCount').textContent = textarea.value.length;
      });
    }
    renderTable();
  }

  function filtered() {
    var q = (document.getElementById('searchInput').value || '').toLowerCase();
    var rarity = document.getElementById('rarityFilter').value;
    var status = document.getElementById('statusFilter').value;
    return pets.filter(function (p) {
      var matchQ = !q || p.id.toLowerCase().indexOf(q) !== -1 || p.petName.toLowerCase().indexOf(q) !== -1;
      var matchR = !rarity || p.rarity === rarity;
      var matchS = !status || (status === 'banned' ? p.isBanned : (status === 'active' ? !p.isBanned : true));
      return matchQ && matchR && matchS;
    });
  }

  function renderTable() {
    var data = filtered();
    var start = (currentPage - 1) * PAGE_SIZE;
    var page = data.slice(start, start + PAGE_SIZE);
    var u = ADMIN_MOCK.currentUser;
    var canMutate = u.role === 'super_admin' || u.role === 'moderator';
    var tbody = document.getElementById('petsBody');

    tbody.innerHTML = page.map(function (p) {
      var statusClass = p.isBanned ? 'banned' : 'active';
      var statusLabel = p.isBanned ? 'Banned' : 'Active';
      var actions = '';
      if (canMutate) {
        if (!p.isBanned) {
          actions += '<button class="icon-btn danger" onclick="openBanModal(\'' + escapeHtml(p.id) + '\')">Ban</button>';
        } else {
          actions += '<button class="icon-btn success" onclick="doUnban(\'' + escapeHtml(p.id) + '\')">Unban</button>';
        }
      }
      actions += '<button class="icon-btn" onclick="openDetail(\'' + escapeHtml(p.id) + '\')">詳情</button>';
      return '<tr>'
        + '<td class="mono">' + escapeHtml(p.id.slice(0, 8)) + '</td>'
        + '<td><strong>' + escapeHtml(p.petName) + '</strong></td>'
        + '<td>' + escapeHtml(p.rarity) + '</td>'
        + '<td>' + escapeHtml(String(p.level)) + '</td>'
        + '<td class="mono">' + escapeHtml(p.ownerEmailMasked) + '</td>'
        + '<td><span class="status-badge ' + statusClass + '">' + statusLabel + '</span></td>'
        + '<td>' + escapeHtml(p.createdAt) + '</td>'
        + '<td><div class="action-cell">' + actions + '</div></td>'
        + '</tr>';
    }).join('');

    renderPagination(data.length);
  }

  function renderPagination(total) {
    var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    var wrap = document.getElementById('paginationWrap');
    var btns = '<button onclick="goPage(' + Math.max(1, currentPage - 1) + ')">‹</button>';
    for (var i = 1; i <= totalPages; i++) {
      btns += '<span class="page-num' + (i === currentPage ? ' active' : '') + '" onclick="goPage(' + i + ')">' + i + '</span>';
    }
    btns += '<button onclick="goPage(' + Math.min(totalPages, currentPage + 1) + ')">›</button>';
    btns += '<span class="pagination-info">共 ' + total + ' 筆（每頁 ' + PAGE_SIZE + '）</span>';
    wrap.innerHTML = btns;
  }

  function goPage(n) { currentPage = n; renderTable(); }

  function openBanModal(id) {
    banTargetId = id;
    var p = pets.find(function (x) { return x.id === id; });
    if (!p) { return; }
    var info = document.getElementById('banTargetInfo');
    var input = document.getElementById('banReasonInput');
    var counter = document.getElementById('banReasonCount');
    var errEl = document.getElementById('banReasonError');
    if (info) { info.textContent = '目標：' + p.petName + '（' + p.id.slice(0, 8) + '）'; }
    if (input) { input.value = ''; }
    if (counter) { counter.textContent = '0'; }
    if (errEl) { errEl.style.display = 'none'; }
    openModal('banModal');
  }

  function confirmBan() {
    var input = document.getElementById('banReasonInput');
    var errEl = document.getElementById('banReasonError');
    var reason = input ? input.value.trim() : '';
    if (!reason) {
      if (errEl) { errEl.style.display = 'block'; }
      return;
    }
    if (errEl) { errEl.style.display = 'none'; }
    var p = pets.find(function (x) { return x.id === banTargetId; });
    if (!p) { return; }
    p.isBanned = true;
    p.banReason = reason;
    closeModal('banModal');
    renderTable();
    showToast('已 Ban 寵物：' + p.petName, 'success');
  }

  function doUnban(id) {
    var p = pets.find(function (x) { return x.id === id; });
    if (!p) { return; }
    p.isBanned = false;
    p.banReason = null;
    renderTable();
    showToast('已 Unban 寵物：' + p.petName, 'success');
  }

  function openDetail(id) {
    var p = pets.find(function (x) { return x.id === id; });
    if (!p) { return; }
    var content = document.getElementById('detailContent');
    if (!content) { return; }
    content.innerHTML = '<table class="data-table" style="margin-top:8px;"><tbody>'
      + row('Pet ID', '<span class="mono">' + escapeHtml(p.id) + '</span>')
      + row('名稱', escapeHtml(p.petName))
      + row('稀有度', escapeHtml(p.rarity))
      + row('等級', escapeHtml(String(p.level)))
      + row('擁有者 Email', '<span class="mono">' + escapeHtml(p.ownerEmailMasked) + '</span>')
      + row('狀態', p.isBanned ? 'Banned' : 'Active')
      + row('Ban 原因', escapeHtml(p.banReason || '—'))
      + row('建立時間', escapeHtml(p.createdAt))
      + '</tbody></table>';
    openModal('detailModal');
  }

  function row(label, value) {
    return '<tr><td style="color:var(--admin-text-dim);width:120px;">' + label + '</td><td>' + value + '</td></tr>';
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
