<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runtime 設定 · Pixel Pet Arena Admin</title>
  <link rel="stylesheet" href="assets/admin-style.css" />
  <style>
    .weight-row { display: grid; grid-template-columns: 120px 1fr 60px; gap: 12px; align-items: center; margin-bottom: 12px; }
    .weight-label { font-size: 13px; }
    input[type="range"] { width: 100%; accent-color: var(--admin-accent); }
    .weight-total { font-size: 14px; font-weight: 700; }
    .weight-total.ok { color: var(--admin-success); }
    .weight-total.err { color: var(--admin-danger); }
  </style>
</head>
<body>
<header class="admin-topnav">
  <a href="../../index.html" class="back-link">← 文件站</a>
  <span class="topnav-title">🛡️ Pixel Pet Arena Admin</span>
  <div class="topnav-right">
    <span class="current-user" id="currentUserLabel"></span>
    <button class="logout-btn" onclick="location.href='admin-login.html'">登出</button>
  </div>
</header>
<div id="sidebarContainer"></div>

<main class="admin-main">
  <div class="page-header">
    <h1 class="page-title">⚙️ Runtime 設定</h1>
    <span class="page-subtitle">super_admin only — 變更會立即生效並寫入稽核記錄</span>
  </div>

  <div class="panel" style="max-width:600px;">
    <div class="panel-header"><h2 class="panel-title">戰鬥設定</h2></div>

    <div class="form-group">
      <label>每分鐘最大戰鬥數（1–60）</label>
      <input id="maxBattles" class="form-input" type="number" min="1" max="60" value="10" style="max-width:120px;" />
    </div>

    <div class="form-group">
      <label>AI 對手啟用</label>
      <div style="display:flex;align-items:center;gap:10px;margin-top:6px;">
        <label class="toggle-switch" style="position:relative;display:inline-block;width:44px;height:24px;">
          <input type="checkbox" id="aiEnabled" checked style="opacity:0;width:0;height:0;" />
          <span id="toggleTrack" style="position:absolute;inset:0;border-radius:12px;background:var(--admin-accent);cursor:pointer;transition:background 0.2s;">
            <span id="toggleThumb" style="position:absolute;left:4px;top:4px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform 0.2s;transform:translateX(0);"></span>
          </span>
        </label>
        <span id="aiLabel" style="font-size:13px;color:var(--admin-text-dim);">啟用</span>
      </div>
    </div>
  </div>

  <div class="panel" style="max-width:600px;">
    <div class="panel-header">
      <h2 class="panel-title">稀有度生成權重</h2>
      <span id="weightTotal" class="weight-total ok">加總：100%</span>
    </div>
    <p style="font-size:12px;color:var(--admin-text-dim);margin:0 0 16px;">四個滑桿必須加總恰好 100%</p>

    <div class="weight-row">
      <span class="weight-label">Common</span>
      <input type="range" id="wCommon" min="0" max="100" value="60" oninput="syncWeight('Common')" />
      <span id="vCommon" class="weight-total">60%</span>
    </div>
    <div class="weight-row">
      <span class="weight-label">Rare</span>
      <input type="range" id="wRare" min="0" max="100" value="25" oninput="syncWeight('Rare')" />
      <span id="vRare" class="weight-total">25%</span>
    </div>
    <div class="weight-row">
      <span class="weight-label">Epic</span>
      <input type="range" id="wEpic" min="0" max="100" value="12" oninput="syncWeight('Epic')" />
      <span id="vEpic" class="weight-total">12%</span>
    </div>
    <div class="weight-row">
      <span class="weight-label">Legendary</span>
      <input type="range" id="wLegendary" min="0" max="100" value="3" oninput="syncWeight('Legendary')" />
      <span id="vLegendary" class="weight-total">3%</span>
    </div>

    <div id="weightError" style="color:var(--admin-danger);font-size:13px;display:none;">⚠️ 加總必須等於 100%（目前：<span id="weightSum">100</span>%）</div>
  </div>

  <div style="max-width:600px;">
    <button class="btn btn-primary" onclick="openSaveConfirm()" id="saveBtn">儲存設定</button>
  </div>
</main>

<!-- 二次確認 Modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal-card">
    <h3>⚠️ 確認儲存 Runtime 設定</h3>
    <p class="modal-desc">此操作將立即影響所有玩家的戰鬥體驗，請輸入您的密碼確認。</p>
    <div class="form-group">
      <label>確認密碼</label>
      <input id="confirmPw" class="form-input" type="password" placeholder="輸入管理員密碼…" />
    </div>
    <div id="confirmPwError" class="error-msg" style="display:none;">密碼錯誤</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('confirmModal')">取消</button>
      <button class="btn btn-primary" onclick="doSave()">確認儲存</button>
    </div>
  </div>
</div>

<script src="assets/admin-mock.js"></script>
<script>
  function init() {
    var u = ADMIN_MOCK.currentUser;
    var labelEl = document.getElementById('currentUserLabel');
    if (labelEl) { labelEl.textContent = u.username + ' (' + roleDisplayName(u.role) + ')'; }
    var sidebar = document.getElementById('sidebarContainer');
    if (sidebar) { sidebar.innerHTML = renderSidebar('config'); }

    var aiCb = document.getElementById('aiEnabled');
    if (aiCb) {
      aiCb.addEventListener('change', function () {
        var thumb = document.getElementById('toggleThumb');
        var track = document.getElementById('toggleTrack');
        var lbl = document.getElementById('aiLabel');
        if (thumb) { thumb.style.transform = aiCb.checked ? 'translateX(20px)' : 'translateX(0)'; }
        if (track) { track.style.background = aiCb.checked ? 'var(--admin-accent)' : 'var(--admin-border)'; }
        if (lbl) { lbl.textContent = aiCb.checked ? '啟用' : '停用'; }
      });
    }
  }

  function syncWeight(changed) {
    var keys = ['Common', 'Rare', 'Epic', 'Legendary'];
    var total = 0;
    keys.forEach(function (k) {
      var el = document.getElementById('w' + k);
      var vEl = document.getElementById('v' + k);
      if (el && vEl) { vEl.textContent = el.value + '%'; total += parseInt(el.value, 10) || 0; }
    });

    var totalEl = document.getElementById('weightTotal');
    var sumEl = document.getElementById('weightSum');
    var errEl = document.getElementById('weightError');
    var saveBtn = document.getElementById('saveBtn');

    if (totalEl) {
      totalEl.textContent = '加總：' + total + '%';
      totalEl.className = 'weight-total ' + (total === 100 ? 'ok' : 'err');
    }
    if (sumEl) { sumEl.textContent = String(total); }
    if (errEl) { errEl.style.display = total !== 100 ? 'block' : 'none'; }
    if (saveBtn) { saveBtn.disabled = total !== 100; }
  }

  function openSaveConfirm() {
    var total = 0;
    ['Common', 'Rare', 'Epic', 'Legendary'].forEach(function (k) {
      var el = document.getElementById('w' + k);
      if (el) { total += parseInt(el.value, 10) || 0; }
    });
    if (total !== 100) { showToast('稀有度加總必須等於 100%', 'error'); return; }
    var pwEl = document.getElementById('confirmPw');
    var errEl = document.getElementById('confirmPwError');
    if (pwEl) { pwEl.value = ''; }
    if (errEl) { errEl.style.display = 'none'; }
    openModal('confirmModal');
  }

  function doSave() {
    var pw = document.getElementById('confirmPw');
    var errEl = document.getElementById('confirmPwError');
    if (!pw) { return; }
    if (pw.value !== 'Admin@2026') {
      if (errEl) { errEl.style.display = 'block'; }
      return;
    }
    if (errEl) { errEl.style.display = 'none'; }
    closeModal('confirmModal');
    showToast('Runtime 設定已儲存，稽核記錄已寫入', 'success');
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
