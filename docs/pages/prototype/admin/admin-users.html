<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users — Pixel Pet Arena Admin</title>
  <link href="assets/admin-style.css" rel="stylesheet">
</head>
<body>

<header class="admin-topnav">
  <div class="topnav-brand">🛡️ <span>Pixel Pet Arena</span> Admin</div>
  <nav class="topnav-actions">
    <a href="../../index.html" class="back-link">← 文件站</a>
    <span class="topnav-user">👤 Super Admin</span>
    <button class="btn btn-sm btn-secondary" id="logoutBtn">登出</button>
  </nav>
</header>

<div class="admin-layout">
  <div id="sidebarMount"></div>

  <main class="admin-main">
    <div class="page-header">
      <div>
        <h1 class="page-title">Users</h1>
        <p class="page-subtitle">Admin 使用者管理 — 共 8 位成員</p>
      </div>
      <button class="btn btn-primary" id="addUserBtn">+ 新增使用者</button>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>使用者列表</h2>
      </div>

      <!-- Filter Bar -->
      <div class="filter-bar">
        <input type="text" id="searchInput" class="form-control search-input" placeholder="搜尋用戶名 / Email…">
        <select id="roleFilter" class="form-control">
          <option value="">所有角色</option>
          <option value="super_admin">Super Admin</option>
          <option value="moderator">Moderator</option>
          <option value="read_only">Read Only</option>
        </select>
        <select id="statusFilter" class="form-control">
          <option value="">所有狀態</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
          <option value="locked">Locked</option>
        </select>
        <button class="btn btn-secondary btn-sm" id="clearFiltersBtn">清除篩選</button>
      </div>

      <div class="data-table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>用戶名</th>
              <th>姓名</th>
              <th>Email</th>
              <th>角色</th>
              <th>狀態</th>
              <th>MFA</th>
              <th>最後登入</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="userTableBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Add User Modal -->
<div class="modal-overlay" id="addUserModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>新增使用者</h3>
      <button class="modal-close" id="closeModalBtn">✕</button>
    </div>
    <div class="form-group">
      <label for="newUsername">用戶名稱</label>
      <input type="text" id="newUsername" class="form-control" placeholder="例：mod_tina" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="newName">顯示名稱</label>
      <input type="text" id="newName" class="form-control" placeholder="例：Tina Lin" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="newEmail">Email</label>
      <input type="email" id="newEmail" class="form-control" placeholder="例：tina@pixel-pet.io" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="newRole">角色</label>
      <select id="newRole" class="form-control">
        <option value="super_admin">超級管理員 (super_admin)</option>
        <option value="moderator" selected>內容審查員 (moderator)</option>
        <option value="read_only">唯讀分析師 (read_only)</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancelModalBtn">取消</button>
      <button class="btn btn-primary" id="confirmAddBtn">建立帳號</button>
    </div>
  </div>
</div>

<script src="assets/admin-mock.js"></script>
<script>
(function () {
  'use strict';

  const SAFE_PAGES = {
    'admin-login.html': 'admin-login.html'
  };
  function safeNav(page) { if (SAFE_PAGES[page]) location.href = SAFE_PAGES[page]; }

  if (typeof ADMIN_MOCK === 'undefined' || typeof renderSidebar === 'undefined') {
    console.error('admin-mock.js not loaded'); return;
  }

  /* ── Sidebar ────────────────────────────────────────────── */
  const sidebarMount = document.getElementById('sidebarMount');
  if (sidebarMount && sidebarMount.parentNode) {
    sidebarMount.parentNode.replaceChild(renderSidebar('users'), sidebarMount);
  }

  /* ── Logout ─────────────────────────────────────────────── */
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) logoutBtn.addEventListener('click', function () { safeNav('admin-login.html'); });

  /* ── Filter state ───────────────────────────────────────── */
  const ALLOWED_ROLES   = new Set(['', 'super_admin', 'moderator', 'read_only']);
  const ALLOWED_STATUSES = new Set(['', 'active', 'inactive', 'locked']);

  function safeSelectValue(el, allowed) {
    const v = el ? el.value : '';
    return allowed.has(v) ? v : '';
  }

  function renderTable() {
    const search = (document.getElementById('searchInput').value || '').toLowerCase();
    const role   = safeSelectValue(document.getElementById('roleFilter'),   ALLOWED_ROLES);
    const status = safeSelectValue(document.getElementById('statusFilter'), ALLOWED_STATUSES);

    const tbody = document.getElementById('userTableBody');
    if (!tbody) return;
    tbody.innerHTML = '';   // clear — no user data in innerHTML, safe wipe

    const users = ADMIN_MOCK.users;
    if (!Array.isArray(users)) return;

    users.filter(function (u) {
      const matchSearch = !search ||
        String(u.username || '').toLowerCase().includes(search) ||
        String(u.email    || '').toLowerCase().includes(search) ||
        String(u.name     || '').toLowerCase().includes(search);
      const matchRole   = !role   || u.role   === role;
      const matchStatus = !status || u.status === status;
      return matchSearch && matchRole && matchStatus;
    }).forEach(function (u) {
      const tr = document.createElement('tr');

      function td(text, cls) {
        const el = document.createElement('td');
        if (cls) el.className = cls;
        el.textContent = String(text === null || text === undefined ? '' : text);
        return el;
      }

      // ID
      tr.appendChild(td('#' + u.id, 'font-mono text-muted'));

      // username
      const tdU = document.createElement('td');
      const code = document.createElement('code');
      code.style.fontSize = '13px';
      code.textContent = String(u.username || '');
      tdU.appendChild(code);
      tr.appendChild(tdU);

      // name
      tr.appendChild(td(u.name));

      // email
      tr.appendChild(td(u.email, 'text-muted'));

      // role badge — roleBadge() returns HTMLElement
      const tdRole = document.createElement('td');
      if (typeof roleBadge === 'function') {
        const badge = roleBadge(u.role);
        if (badge instanceof HTMLElement) { tdRole.appendChild(badge); }
        else { tdRole.textContent = String(u.role || ''); }
      } else {
        tdRole.textContent = String(u.role || '');
      }
      tr.appendChild(tdRole);

      // status badge — statusBadge() returns HTMLElement
      const tdStatus = document.createElement('td');
      if (typeof statusBadge === 'function') {
        const badge = statusBadge(u.status);
        if (badge instanceof HTMLElement) { tdStatus.appendChild(badge); }
        else { tdStatus.textContent = String(u.status || ''); }
      } else {
        tdStatus.textContent = String(u.status || '');
      }
      tr.appendChild(tdStatus);

      // mfa_enabled badge
      const tdMfa = document.createElement('td');
      const mfaBadge = document.createElement('span');
      mfaBadge.className = 'status-badge ' + (u.mfa_enabled ? 'active' : 'inactive');
      mfaBadge.textContent = u.mfa_enabled ? '✓ 已啟用' : '✗ 未啟用';
      tdMfa.appendChild(mfaBadge);
      tr.appendChild(tdMfa);

      // last_login
      tr.appendChild(td(u.last_login, 'font-mono text-muted'));

      // actions
      const tdAct = document.createElement('td');
      tdAct.style.whiteSpace = 'nowrap';

      const editBtn = document.createElement('button');
      editBtn.className = 'btn btn-sm btn-secondary';
      editBtn.style.marginRight = '4px';
      editBtn.textContent = '編輯';
      editBtn.addEventListener('click', function () { alert('編輯功能（Prototype）'); });

      const lockBtn = document.createElement('button');
      lockBtn.className = 'btn btn-sm btn-' + (u.status === 'locked' ? 'secondary' : 'ghost');
      lockBtn.style.marginRight = '4px';
      lockBtn.textContent = u.status === 'locked' ? '解鎖' : '鎖定';
      lockBtn.addEventListener('click', function () { alert((u.status === 'locked' ? '解鎖' : '鎖定') + '：' + u.username + '（Prototype）'); });

      const delBtn = document.createElement('button');
      delBtn.className = 'btn btn-sm btn-danger';
      delBtn.textContent = '刪除';
      delBtn.addEventListener('click', function () { alert('刪除：' + u.username + '（Prototype）'); });

      tdAct.appendChild(editBtn); tdAct.appendChild(lockBtn); tdAct.appendChild(delBtn);
      tr.appendChild(tdAct);

      tbody.appendChild(tr);
    });
  }

  /* ── Filter listeners ───────────────────────────────────── */
  ['searchInput', 'roleFilter', 'statusFilter'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', renderTable);
  });

  const clearBtn = document.getElementById('clearFiltersBtn');
  if (clearBtn) clearBtn.addEventListener('click', function () {
    document.getElementById('searchInput').value = '';
    document.getElementById('roleFilter').value  = '';
    document.getElementById('statusFilter').value = '';
    renderTable();
  });

  /* ── Modal ──────────────────────────────────────────────── */
  const modal = document.getElementById('addUserModal');

  function openModal()  { if (modal) modal.classList.add('open'); }
  function closeModal() { if (modal) modal.classList.remove('open'); }

  const addUserBtn    = document.getElementById('addUserBtn');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const cancelBtn     = document.getElementById('cancelModalBtn');
  const confirmBtn    = document.getElementById('confirmAddBtn');

  if (addUserBtn)    addUserBtn.addEventListener('click', openModal);
  if (closeModalBtn) closeModalBtn.addEventListener('click', closeModal);
  if (cancelBtn)     cancelBtn.addEventListener('click', closeModal);

  if (modal) modal.addEventListener('click', function (e) {
    if (e.target === modal) closeModal();
  });

  if (confirmBtn) confirmBtn.addEventListener('click', function () {
    const username = (document.getElementById('newUsername').value || '').trim();
    if (!username) { alert('請填寫用戶名稱'); return; }
    alert('帳號建立成功（Prototype 模式，未實際寫入）：' + username);
    closeModal();
  });

  /* ── Initial render ─────────────────────────────────────── */
  renderTable();
}());
</script>
</body>
</html>
