<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>使用者管理 · Pixel Pet Arena Admin</title>
  <link rel="stylesheet" href="assets/admin-style.css" />
</head>
<body>

<header class="admin-topnav">
  <a href="../../index.html" class="back-link">← 文件站</a>
  <span class="topnav-title">🛡️ Pixel Pet Arena Admin</span>
  <div class="topnav-right">
    <span id="topnavUser"></span>
    <button class="logout-btn" onclick="location.href='admin-login.html'">登出</button>
  </div>
</header>

<div id="sidebarContainer"></div>

<main class="admin-main">
  <div class="page-header">
    <h1 class="page-title">👥 使用者管理</h1>
    <button class="btn btn-primary" onclick="openModal('newUserModal')">+ 新增使用者</button>
  </div>

  <div class="search-bar">
    <input type="text" id="searchKeyword" class="form-input" placeholder="搜尋使用者名稱、名稱或 Email…" />
    <select id="filterRole" class="form-select">
      <option value="">全部角色</option>
      <option value="super_admin">Super Admin</option>
      <option value="moderator">Moderator</option>
      <option value="read_only">Read Only</option>
    </select>
    <select id="filterStatus" class="form-select">
      <option value="">全部狀態</option>
      <option value="active">Active</option>
      <option value="locked">Locked</option>
      <option value="inactive">Inactive</option>
    </select>
    <button class="btn btn-primary" onclick="applyFilters()">搜尋</button>
    <button class="btn btn-ghost" onclick="clearFilters()">清除</button>
  </div>

  <table class="data-table" id="usersTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>使用者名稱</th>
        <th>顯示名稱</th>
        <th>Email</th>
        <th>角色</th>
        <th>狀態</th>
        <th>MFA</th>
        <th>最後登入</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="pagination" id="paginationContainer">
    <span class="pagination-info" id="paginationInfo">— 筆記錄</span>
  </div>
</main>

<!-- New User Modal -->
<div class="modal-overlay" id="newUserModal" role="dialog" aria-modal="true" aria-labelledby="newUserTitle">
  <div class="modal-card">
    <h3 id="newUserTitle">+ 新增管理員帳號</h3>
    <p class="modal-desc">建立管理員帳號後，使用者將收到開通 Email，並須在首次登入時啟用 TOTP。</p>

    <form id="newUserForm" onsubmit="return submitNewUser(event)">
      <div class="form-row">
        <div class="form-group">
          <label for="newUsername">使用者名稱</label>
          <input type="text" id="newUsername" class="form-input" required pattern="[a-z0-9_-]{3,32}" placeholder="alice" />
        </div>
        <div class="form-group">
          <label for="newName">顯示名稱</label>
          <input type="text" id="newName" class="form-input" required placeholder="Alice Chen" />
        </div>
      </div>
      <div class="form-group">
        <label for="newEmail">Email</label>
        <input type="email" id="newEmail" class="form-input" required placeholder="alice@pixelpet.arena" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="newRole">角色</label>
          <select id="newRole" class="form-select" required>
            <option value="moderator">Moderator — 內容審查</option>
            <option value="read_only">Read Only — 唯讀分析</option>
            <option value="super_admin">Super Admin — 完整權限</option>
          </select>
        </div>
        <div class="form-group">
          <label for="newPassword">初始密碼</label>
          <input type="password" id="newPassword" class="form-input mono" required minlength="10" placeholder="至少 10 個字元" autocomplete="new-password" />
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal('newUserModal')">取消</button>
        <button type="submit" class="btn btn-primary">建立帳號</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit Role Modal -->
<div class="modal-overlay" id="editUserModal" role="dialog" aria-modal="true" aria-labelledby="editUserTitle">
  <div class="modal-card">
    <h3 id="editUserTitle">編輯使用者</h3>
    <input type="hidden" id="editUserId" />
    <div class="form-group">
      <label for="editRole">角色</label>
      <select id="editRole" class="form-select">
        <option value="moderator">Moderator</option>
        <option value="read_only">Read Only</option>
        <option value="super_admin">Super Admin</option>
      </select>
    </div>
    <div class="form-group">
      <label for="editStatus">狀態</label>
      <select id="editStatus" class="form-select">
        <option value="active">Active</option>
        <option value="locked">Locked</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" onclick="closeModal('editUserModal')">取消</button>
      <button type="button" class="btn btn-primary" onclick="saveEditUser()">儲存</button>
    </div>
  </div>
</div>

<script src="assets/admin-mock.js"></script>
<script>
  let renderRows = ADMIN_MOCK.users.slice();

  // Init topnav user
  document.getElementById('topnavUser').textContent =
    ADMIN_MOCK.currentUser.username + ' (' + roleDisplayName(ADMIN_MOCK.currentUser.role) + ')';

  // Init sidebar
  document.getElementById('sidebarContainer').innerHTML = renderSidebar('users');

  function renderTable() {
    const tbody = document.querySelector('#usersTable tbody');
    tbody.textContent = '';

    renderRows.forEach(function(u) {
      const tr = document.createElement('tr');

      tr.appendChild(td(u.id, 'mono'));
      tr.appendChild(td(u.username, 'mono'));
      tr.appendChild(td(u.name));
      tr.appendChild(td(u.email));

      const roleCell = document.createElement('td');
      const roleTag = document.createElement('span');
      roleTag.className = 'role-tag ' + roleColorClass(u.role);
      roleTag.textContent = roleDisplayName(u.role);
      roleCell.appendChild(roleTag);
      tr.appendChild(roleCell);

      const statusCell = document.createElement('td');
      const badge = document.createElement('span');
      badge.className = 'status-badge ' + (u.status || 'inactive');
      badge.textContent = u.status;
      statusCell.appendChild(badge);
      tr.appendChild(statusCell);

      const mfaCell = document.createElement('td');
      mfaCell.innerHTML = u.mfa_enabled
        ? '<span class="status-badge active">✓ ON</span>'
        : '<span class="status-badge inactive">✗ OFF</span>';
      tr.appendChild(mfaCell);

      tr.appendChild(td(u.last_login || '—', 'mono'));

      const actCell = document.createElement('td');
      const actWrap = document.createElement('div');
      actWrap.className = 'action-cell';

      const editBtn = document.createElement('button');
      editBtn.className = 'icon-btn';
      editBtn.textContent = '編輯';
      editBtn.addEventListener('click', function() {
        document.getElementById('editUserId').value = u.id;
        document.getElementById('editRole').value = u.role;
        document.getElementById('editStatus').value = u.status;
        openModal('editUserModal');
      });

      const lockBtn = document.createElement('button');
      const isLocked = u.status === 'locked';
      lockBtn.className = 'icon-btn ' + (isLocked ? 'success' : 'danger');
      lockBtn.textContent = isLocked ? '解鎖' : '鎖定';
      lockBtn.addEventListener('click', function() {
        u.status = isLocked ? 'active' : 'locked';
        showToast((isLocked ? '已解鎖 ' : '已鎖定 ') + u.username, isLocked ? 'success' : 'warning');
        renderTable();
      });

      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn danger';
      delBtn.textContent = '刪除';
      delBtn.disabled = u.username === 'admin';
      if (u.username === 'admin') delBtn.title = '最高管理員無法刪除';
      delBtn.addEventListener('click', function() {
        if (confirm('確定要刪除管理員帳號「' + u.username + '」？此操作無法復原。')) {
          ADMIN_MOCK.users = ADMIN_MOCK.users.filter(function(x) { return x.id !== u.id; });
          renderRows = renderRows.filter(function(x) { return x.id !== u.id; });
          showToast('🗑 已刪除 ' + u.username, 'warning');
          renderTable();
        }
      });

      actWrap.appendChild(editBtn);
      actWrap.appendChild(lockBtn);
      actWrap.appendChild(delBtn);
      actCell.appendChild(actWrap);
      tr.appendChild(actCell);

      tbody.appendChild(tr);
    });

    document.getElementById('paginationInfo').textContent =
      '共 ' + renderRows.length + ' 筆記錄';
  }

  function td(text, cls) {
    const el = document.createElement('td');
    if (cls) el.className = cls;
    el.textContent = (text == null) ? '—' : text;
    return el;
  }

  function applyFilters() {
    const kw = (document.getElementById('searchKeyword').value || '').trim().toLowerCase();
    const r  = document.getElementById('filterRole').value;
    const st = document.getElementById('filterStatus').value;

    renderRows = ADMIN_MOCK.users.filter(function(u) {
      if (kw) {
        const hay = (u.username + ' ' + u.name + ' ' + u.email).toLowerCase();
        if (hay.indexOf(kw) === -1) return false;
      }
      if (r && u.role !== r) return false;
      if (st && u.status !== st) return false;
      return true;
    });
    renderTable();
  }

  function clearFilters() {
    document.getElementById('searchKeyword').value = '';
    document.getElementById('filterRole').value = '';
    document.getElementById('filterStatus').value = '';
    renderRows = ADMIN_MOCK.users.slice();
    renderTable();
  }

  function submitNewUser(e) {
    e.preventDefault();
    const username = document.getElementById('newUsername').value.trim();
    const name     = document.getElementById('newName').value.trim();
    const email    = document.getElementById('newEmail').value.trim();
    const role     = document.getElementById('newRole').value;

    if (ADMIN_MOCK.users.some(function(u) { return u.username === username; })) {
      showToast('使用者名稱「' + username + '」已存在。', 'error');
      return false;
    }

    const newId = Math.max.apply(null, ADMIN_MOCK.users.map(function(u) { return u.id; })) + 1;
    ADMIN_MOCK.users.push({
      id: newId,
      username: username,
      name: name,
      email: email,
      role: role,
      status: 'active',
      mfa_enabled: false,
      last_login: '—',
      created_at: new Date().toISOString().replace('T', ' ').slice(0, 19),
    });
    renderRows = ADMIN_MOCK.users.slice();
    renderTable();
    document.getElementById('newUserForm').reset();
    closeModal('newUserModal');
    showToast('✅ 已建立帳號：' + username, 'success');
    return false;
  }

  function saveEditUser() {
    const id     = parseInt(document.getElementById('editUserId').value, 10);
    const role   = document.getElementById('editRole').value;
    const status = document.getElementById('editStatus').value;
    const u = ADMIN_MOCK.users.find(function(x) { return x.id === id; });
    if (u) {
      u.role   = role;
      u.status = status;
      showToast('✅ 已更新 ' + u.username, 'success');
      renderTable();
    }
    closeModal('editUserModal');
  }

  renderTable();
</script>
</body>
</html>
