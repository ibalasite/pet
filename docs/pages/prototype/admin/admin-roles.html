<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>角色管理 · Pixel Pet Arena Admin</title>
  <link rel="stylesheet" href="assets/admin-style.css" />
</head>
<body>
<header class="admin-topnav">
  <a href="../../index.html" class="back-link">← 文件站</a>
  <span class="topnav-title">🛡️ Pixel Pet Arena Admin</span>
  <div class="topnav-right">
    <span class="current-user" id="currentUserLabel"></span>
    <button class="logout-btn" onclick="location.href='admin-login.html'">登出</button>
  </div>
</header>
<div id="sidebarContainer"></div>

<main class="admin-main">
  <div class="page-header">
    <h1 class="page-title">👥 角色管理</h1>
    <button class="btn btn-primary" onclick="openModal('addUserModal')">+ 新增 Admin 用戶</button>
  </div>

  <!-- 角色卡片 -->
  <h2 style="font-size:15px;margin:0 0 12px;color:var(--admin-text-dim);text-transform:uppercase;letter-spacing:0.5px;">系統角色</h2>
  <div class="role-grid" id="roleGrid"></div>

  <!-- Admin Users 表格 -->
  <h2 style="font-size:15px;margin:24px 0 12px;color:var(--admin-text-dim);text-transform:uppercase;letter-spacing:0.5px;">Admin 用戶列表</h2>
  <table class="data-table">
    <thead>
      <tr><th>ID</th><th>帳號</th><th>姓名</th><th>Email</th><th>角色</th><th>狀態</th><th>MFA</th><th>最後登入</th><th>操作</th></tr>
    </thead>
    <tbody id="usersBody"></tbody>
  </table>
</main>

<!-- 新增用戶 Modal -->
<div class="modal-overlay" id="addUserModal">
  <div class="modal-card" style="max-width:480px;">
    <h3>➕ 新增 Admin 用戶</h3>
    <p class="modal-desc">新用戶首次登入時需完成 TOTP 設定</p>
    <div class="form-group">
      <label>帳號</label>
      <input id="newUsername" class="form-input" type="text" placeholder="英文小寫帳號…" />
    </div>
    <div class="form-group">
      <label>初始密碼</label>
      <input id="newPassword" class="form-input" type="password" placeholder="至少 12 字元…" />
    </div>
    <div class="form-group">
      <label>角色</label>
      <select id="newRole" class="form-select">
        <option value="moderator">內容審查員 (moderator)</option>
        <option value="read_only">唯讀分析師 (read_only)</option>
      </select>
    </div>
    <div id="addUserError" class="error-msg" style="display:none;"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('addUserModal')">取消</button>
      <button class="btn btn-primary" onclick="doAddUser()">建立用戶</button>
    </div>
  </div>
</div>

<!-- TOTP Reset Confirm Modal -->
<div class="modal-overlay" id="totpResetModal">
  <div class="modal-card">
    <h3>🔐 重置 TOTP</h3>
    <p class="modal-desc" id="totpResetDesc"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('totpResetModal')">取消</button>
      <button class="btn btn-danger" onclick="confirmTotpReset()">確認重置</button>
    </div>
  </div>
</div>

<script src="assets/admin-mock.js"></script>
<script>
  var users = (ADMIN_MOCK.users || []).map(function (u) { return Object.assign({}, u); });
  var totpResetTargetId = null;

  function init() {
    var u = ADMIN_MOCK.currentUser;
    if (!u) { return; }
    var labelEl = document.getElementById('currentUserLabel');
    if (labelEl) { labelEl.textContent = u.username + ' (' + roleDisplayName(u.role) + ')'; }
    var sidebar = document.getElementById('sidebarContainer');
    if (sidebar) { sidebar.innerHTML = renderSidebar('roles'); }

    renderRoleGrid();
    renderUsersTable();
  }

  function renderRoleGrid() {
    var grid = document.getElementById('roleGrid');
    if (!grid) { return; }
    grid.innerHTML = (ADMIN_MOCK.roles || []).map(function (r) {
      var permList = r.permissions.slice(0, 6).map(function (p) {
        return '<span class="permission-chip enabled">' + escapeHtml(p) + '</span>';
      }).join('');
      if (r.permissions.length > 6) {
        permList += '<span class="permission-chip" style="opacity:0.5;">+' + (r.permissions.length - 6) + ' 更多</span>';
      }
      return '<div class="role-card">'
        + '<div class="role-card-head">'
        + '<h3>' + escapeHtml(r.display) + '</h3>'
        + '<span class="role-tag ' + escapeHtml(r.color_class) + '">' + escapeHtml(r.name) + '</span>'
        + '</div>'
        + '<div class="role-meta"><span class="role-user-count">' + r.user_count + '</span> 位用戶</div>'
        + '<div class="permission-chips">' + permList + '</div>'
        + '</div>';
    }).join('');
  }

  function renderUsersTable() {
    var tbody = document.getElementById('usersBody');
    if (!tbody) { return; }
    tbody.innerHTML = users.map(function (u) {
      var statusClass = u.status === 'active' ? 'active' : 'locked';
      var mfaBadge = u.mfa_enabled
        ? '<span class="status-badge active">✓ 啟用</span>'
        : '<span class="status-badge warning">✗ 未設</span>';
      var isSuperAdmin = u.role === 'super_admin';
      var actions = '';
      if (!isSuperAdmin) {
        actions += '<button class="icon-btn danger" onclick="openTotpReset(' + u.id + ')">TOTP 重置</button>';
      }
      return '<tr>'
        + '<td>' + escapeHtml(String(u.id)) + '</td>'
        + '<td><strong>' + escapeHtml(u.username) + '</strong></td>'
        + '<td>' + escapeHtml(u.name) + '</td>'
        + '<td class="mono">' + escapeHtml(u.email) + '</td>'
        + '<td><span class="role-tag ' + escapeHtml(roleColorClass(u.role)) + '">' + escapeHtml(roleDisplayName(u.role)) + '</span></td>'
        + '<td><span class="status-badge ' + statusClass + '">' + escapeHtml(u.status) + '</span></td>'
        + '<td>' + mfaBadge + '</td>'
        + '<td>' + escapeHtml(u.last_login) + '</td>'
        + '<td><div class="action-cell">' + (actions || '—') + '</div></td>'
        + '</tr>';
    }).join('');
  }

  function doAddUser() {
    var usernameEl = document.getElementById('newUsername');
    var passwordEl = document.getElementById('newPassword');
    var roleEl     = document.getElementById('newRole');
    var errEl      = document.getElementById('addUserError');
    if (!usernameEl || !passwordEl || !roleEl || !errEl) { return; }

    var username = usernameEl.value.trim();
    var password = passwordEl.value;
    var role     = roleEl.value;

    if (!username || !/^[a-z0-9_]{3,32}$/.test(username)) {
      errEl.textContent = '帳號格式錯誤（3-32 位英文小寫/數字）';
      errEl.style.display = 'block';
      return;
    }
    if (!password || password.length < 12) {
      errEl.textContent = '密碼至少 12 字元';
      errEl.style.display = 'block';
      return;
    }
    if (users.some(function (u) { return u.username === username; })) {
      errEl.textContent = '帳號已存在';
      errEl.style.display = 'block';
      return;
    }

    errEl.style.display = 'none';
    var newId = users.reduce(function (max, u) { return u.id > max ? u.id : max; }, 0) + 1;
    users.push({
      id: newId, username: username, name: username, email: username + '@pixelpet.arena',
      role: role, status: 'active', mfa_enabled: false,
      last_login: '—', created_at: new Date().toISOString().slice(0, 19).replace('T', ' '),
    });
    closeModal('addUserModal');
    usernameEl.value = '';
    passwordEl.value = '';
    renderUsersTable();
    showToast('已建立用戶：' + username, 'success');
  }

  function openTotpReset(userId) {
    var u = users.find(function (x) { return x.id === userId; });
    if (!u) { return; }
    totpResetTargetId = userId;
    var descEl = document.getElementById('totpResetDesc');
    if (descEl) { descEl.textContent = '將重置 ' + u.username + ' 的 TOTP，下次登入時需重新掃描 QR Code。此操作不可撤銷。'; }
    openModal('totpResetModal');
  }

  function confirmTotpReset() {
    if (totpResetTargetId === null) { closeModal('totpResetModal'); return; }
    var u = users.find(function (x) { return x.id === totpResetTargetId; });
    if (u) { u.mfa_enabled = false; }
    totpResetTargetId = null;
    closeModal('totpResetModal');
    renderUsersTable();
    showToast('TOTP 已重置，用戶下次登入需重新設定', 'warning');
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
