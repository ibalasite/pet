<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pixel Pet Arena — Interactive Prototype with 10 player-facing screens, animated pixel pets, training, battles, leaderboard, marketplace, and GDPR self-service.">
  <title>Pixel Pet Arena — Interactive Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/prototype.css">
</head>
<body>
  <nav id="proto-nav" aria-label="Prototype navigation">
    <a href="../index.html" class="nav-link nav-link--docs" title="返回文件站">← 文件站</a>
    <button onclick="router.back()" class="nav-btn" title="返回上一頁">← 返回</button>
    <span id="breadcrumb">Loading...</span>
    <span class="nav-spacer"></span>
    <button onclick="showFlowMap()" class="nav-btn" title="查看所有畫面">📍 流程地圖</button>
    <a href="api-explorer/index.html" class="nav-link" title="API Explorer">🔌 API Explorer</a>
    <a href="admin/admin-login.html" class="nav-link nav-link--admin" title="管理員後台">🛡️ Admin Portal</a>
  </nav>

  <main id="proto-content" role="main">
    <!-- Screen content rendered here by router -->
  </main>

  <!-- Flow map modal (overlay listing all 10 screens) -->
  <div id="flow-map-modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="flow-map-title">
    <div class="modal-card">
      <h2 id="flow-map-title">📍 使用者流程地圖</h2>
      <p class="text-secondary">點擊任一畫面跳轉。</p>
      <div id="screen-grid"></div>
      <div class="modal-actions">
        <button onclick="hideFlowMap()" class="btn btn-secondary">關閉</button>
      </div>
    </div>
  </div>

  <!-- iOS audio unlock button (visible until first click) -->
  <button id="audio-unlock-btn"
          onclick="audioEngine.unlock(); this.style.display='none';"
          aria-label="Enable audio">🔊 啟用音效</button>

  <!-- Particle FX overlay -->
  <canvas id="fx-canvas" aria-hidden="true"></canvas>

  <!-- Toast container -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Scripts: order matters -->
  <script src="assets/mock-data.js"></script>
  <script src="assets/audio-engine.js"></script>
  <script src="assets/fx-engine.js"></script>
  <script src="assets/prototype.js"></script>
</body>
</html>
