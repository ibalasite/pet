<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pixel Pet Arena — Interactive Prototype. 14 player-facing screens: Landing, Claim (Email→OTP→URL Reveal), My Pet, Training, Arena Lobby, Battle, Leaderboard, Battle Result, Records, Marketplace, Token Recovery, GDPR.">
  <title>Pixel Pet Arena — Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/prototype.css">
</head>
<body>

<!-- ============================================================
     FX Canvas (fixed overlay, pointer-events: none)
     ============================================================ -->
<canvas id="fx-canvas" aria-hidden="true"></canvas>

<!-- ============================================================
     NavBar
     ============================================================ -->
<nav class="proto-nav" role="navigation" aria-label="Prototype navigation">
  <a href="../index.html" class="proto-nav-btn" title="Return to docs site" style="text-decoration:none">
    ← Docs
  </a>
  <span class="proto-nav-sep">|</span>
  <span class="proto-nav-brand">⚡ PPA</span>
  <span class="proto-nav-sep">›</span>
  <span class="proto-breadcrumb" id="proto-breadcrumb">Loading...</span>
  <div class="proto-nav-actions">
    <button class="proto-nav-btn" onclick="router.back()" title="Go back" aria-label="Go back">← Back</button>
    <button class="proto-nav-btn" onclick="showFlowMap()" title="Screen flow map" aria-label="Open flow map">🗺️ Map</button>
    <button class="proto-nav-btn" id="audio-toggle-btn" onclick="audioEngine.unlock();this.textContent='🔊 ON';this.style.color='var(--color-success)'" title="Enable audio" aria-label="Enable audio">🔇 Audio</button>
  </div>
</nav>

<!-- ============================================================
     Main content — router mounts here
     ============================================================ -->
<main id="proto-content" role="main" aria-live="polite">
  <div style="display:flex;align-items:center;justify-content:center;height:80vh">
    <div class="font-display text-center" style="font-size:10px;color:var(--color-text-secondary)">
      LOADING PROTOTYPE...<span class="animate-blink">▌</span>
    </div>
  </div>
</main>

<!-- ============================================================
     Audio Unlock Button (iOS / mobile)
     ============================================================ -->
<button id="audio-unlock-btn"
        onclick="audioEngine.unlock();this.style.display='none'"
        aria-label="Enable audio">
  🔇 TAP TO ENABLE AUDIO
</button>

<!-- ============================================================
     Scripts — order matters
     ============================================================ -->
<script src="assets/mock-data.js"></script>
<script src="assets/audio-engine.js"></script>
<script src="assets/fx-engine.js"></script>
<script src="assets/prototype.js"></script>

<script>
  // Boot sequence
  document.addEventListener('DOMContentLoaded', function () {
    // Init particle engine
    fxEngine.init();

    // Init router (reads hash or defaults to screen-01)
    router.init();

    // Handle hash changes (browser back/forward)
    window.addEventListener('hashchange', function () {
      const hash = window.location.hash.replace('#', '');
      if (hash && router.routes[hash] && hash !== router.current) {
        router.navigate(hash, { replace: true });
      }
    });

    // Keyboard shortcut: M = flow map, Escape = close modals
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        const modal = document.querySelector('.modal-overlay');
        if (modal) modal.remove();
      }
      if (e.key === 'm' && !e.target.matches('input,textarea,select')) {
        showFlowMap();
      }
    });
  });
</script>

</body>
</html>
