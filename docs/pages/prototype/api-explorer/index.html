<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pixel-pet-arena — API Explorer</title>
  <style>
    :root {
      --primary: #6c5ce7;
      --primary-light: #a29bfe;
      --success: #00b894;
      --error: #e87c7c;
      --warning: #fdcb6e;
      --info: #2d9ef5;
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface2: #0f3460;
      --border: #2d3561;
      --text: #e8e8f0;
      --text-muted: #8892b0;
      --radius: 6px;
      --radius-lg: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Nav */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 100;
    }

    .brand {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-light);
      letter-spacing: -0.3px;
    }

    .brand span {
      color: var(--text-muted);
      font-weight: 400;
    }

    .nav-link {
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: color 0.15s, border-color 0.15s;
    }

    .nav-link:hover { color: var(--text); border-color: var(--primary); }

    /* Layout */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .search-wrap {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    .search-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 7px 10px;
      font-size: 12.5px;
      outline: none;
    }

    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus { border-color: var(--primary); }

    #endpoint-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    #endpoint-list::-webkit-scrollbar { width: 4px; }
    #endpoint-list::-webkit-scrollbar-track { background: transparent; }
    #endpoint-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .ep-group { margin-bottom: 4px; }

    .ep-group-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      user-select: none;
    }

    .ep-group-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .ep-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px 7px 20px;
      cursor: pointer;
      font-size: 12.5px;
      color: var(--text-muted);
      border-left: 2px solid transparent;
      transition: background 0.1s;
    }

    .ep-item:hover { background: rgba(108,92,231,0.08); color: var(--text); }

    .ep-item.active {
      background: rgba(108,92,231,0.15);
      color: var(--primary-light);
      border-left-color: var(--primary);
    }

    .ep-path {
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 11.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Method badges */
    .method-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 18px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .method-get    { background: rgba(0,184,148,0.15); color: #00b894; }
    .method-post   { background: rgba(45,158,245,0.15); color: #2d9ef5; }
    .method-put    { background: rgba(253,203,110,0.15); color: #fdcb6e; }
    .method-delete { background: rgba(232,124,124,0.15); color: #e87c7c; }
    .method-patch  { background: rgba(162,155,254,0.15); color: #a29bfe; }

    /* Main panel */
    .main-panel {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Welcome state */
    .welcome-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-muted);
      gap: 12px;
    }

    .welcome-state h2 { font-size: 22px; color: var(--text); font-weight: 600; }
    .welcome-state p { font-size: 14px; max-width: 420px; line-height: 1.6; }

    .welcome-grid {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 16px;
    }

    .welcome-pill {
      padding: 5px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Endpoint panel */
    .ep-panel {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ep-panel::-webkit-scrollbar { width: 4px; }
    .ep-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Postman bar */
    .postman-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .url-display {
      flex: 1;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 12.5px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .send-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, transform 0.1s;
    }

    .send-btn:hover { background: #7c6cf7; }
    .send-btn:active { transform: scale(0.98); }
    .send-btn.loading { opacity: 0.7; cursor: wait; }

    .curl-copy-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .curl-copy-btn:hover { background: rgba(108,92,231,0.12); color: var(--primary-light); border-color: var(--primary); }

    /* Request tabs */
    .req-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      overflow: hidden;
    }

    .req-tab {
      padding: 10px 16px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
      user-select: none;
    }

    .req-tab:hover { color: var(--text); }
    .req-tab.active { color: var(--primary-light); border-bottom-color: var(--primary); }

    .req-tab-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      background: var(--primary);
      border-radius: 50%;
      font-size: 10px;
      color: white;
      margin-left: 5px;
    }

    /* Tab panes */
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .req-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      padding: 16px;
    }

    /* Param grid */
    .param-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .param-row {
      display: grid;
      grid-template-columns: 160px 1fr 80px;
      gap: 8px;
      align-items: start;
    }

    .param-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .param-label-name {
      font-family: 'JetBrains Mono', monospace;
      color: var(--primary-light);
    }

    .param-label-type {
      font-size: 10.5px;
      color: var(--text-muted);
      font-weight: 400;
      font-family: sans-serif;
    }

    .param-required {
      font-size: 9.5px;
      color: var(--error);
      font-weight: 700;
      text-transform: uppercase;
    }

    .param-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 7px 10px;
      font-size: 12.5px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }

    .param-input:focus { border-color: var(--primary); }

    .param-location { font-size: 11px; color: var(--text-muted); padding-top: 9px; text-align: center; }

    .param-location-tag {
      display: inline-block;
      padding: 2px 7px;
      background: rgba(108,92,231,0.12);
      border-radius: 3px;
      color: var(--primary-light);
      font-size: 10px;
    }

    .param-desc {
      grid-column: 2;
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: -2px;
    }

    /* Enum chips */
    .enum-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 5px;
    }

    .enum-chip {
      padding: 3px 9px;
      background: rgba(45,61,97,0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }

    .enum-chip:hover { background: rgba(108,92,231,0.2); color: var(--primary-light); border-color: var(--primary); }
    .enum-chip.selected { background: var(--primary); color: white; border-color: var(--primary); }

    /* Auth section */
    .auth-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-type-row { display: flex; align-items: center; gap: 10px; }
    .auth-type-label { font-size: 12px; color: var(--text-muted); width: 100px; }

    .auth-type-val {
      font-size: 12px;
      color: var(--primary-light);
      font-family: 'JetBrains Mono', monospace;
      background: rgba(108,92,231,0.1);
      padding: 3px 10px;
      border-radius: 4px;
    }

    .auth-token-row {
      display: grid;
      grid-template-columns: 100px 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .auth-token-label { font-size: 12.5px; font-weight: 600; color: var(--text); }

    .token-input-wrap { position: relative; }

    .token-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 7px 36px 7px 10px;
      font-size: 11.5px;
      font-family: 'JetBrains Mono', monospace;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }

    .token-input:focus { border-color: var(--primary); }

    .token-vis-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 0;
      line-height: 1;
    }

    .save-token-btn {
      padding: 6px 12px;
      background: rgba(0,184,148,0.15);
      border: 1px solid rgba(0,184,148,0.3);
      border-radius: var(--radius);
      color: var(--success);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .save-token-btn:hover { background: rgba(0,184,148,0.25); }

    .auth-note {
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(45,158,245,0.08);
      border: 1px solid rgba(45,158,245,0.2);
      border-radius: var(--radius);
      padding: 8px 12px;
      line-height: 1.7;
    }

    .auth-required-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .auth-required-badge.required { background: rgba(232,124,124,0.12); color: var(--error); }
    .auth-required-badge.optional { background: rgba(0,184,148,0.1); color: var(--success); }
    .auth-required-badge.public   { background: rgba(45,158,245,0.1); color: var(--info); }

    /* Headers tab */
    .headers-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }

    .headers-table th {
      text-align: left;
      padding: 6px 10px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }

    .headers-table td { padding: 6px 10px; border-bottom: 1px solid rgba(45,61,97,0.5); }

    .header-key-input, .header-val-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      padding: 5px 8px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      width: 100%;
      outline: none;
    }

    .header-key-input:focus, .header-val-input:focus { border-color: var(--primary); }

    .add-header-btn {
      margin-top: 10px;
      padding: 5px 12px;
      background: rgba(108,92,231,0.1);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s, color 0.15s;
    }

    .add-header-btn:hover { background: rgba(108,92,231,0.2); color: var(--text); }

    /* Body editor */
    .body-editor-wrap { display: flex; flex-direction: column; gap: 8px; }

    .body-editor-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .body-content-type { font-size: 11.5px; color: var(--text-muted); }

    .body-format-btn {
      padding: 4px 10px;
      background: rgba(108,92,231,0.1);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .body-format-btn:hover { background: rgba(108,92,231,0.2); }

    .body-editor {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 12px;
      font-size: 12.5px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      line-height: 1.6;
      resize: vertical;
      min-height: 140px;
      width: 100%;
      outline: none;
      tab-size: 2;
    }

    .body-editor:focus { border-color: var(--primary); }

    .json-error-hint { font-size: 11.5px; color: var(--error); display: none; }
    .json-error-hint.visible { display: block; }

    /* Response panel */
    .resp-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: none;
    }

    .resp-panel.visible { display: block; }

    .resp-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(0,0,0,0.2);
      border-bottom: 1px solid var(--border);
    }

    .resp-info { display: flex; align-items: center; gap: 12px; }

    .resp-status-badge {
      font-size: 13px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 4px;
    }

    .resp-status-2xx { background: rgba(0,184,148,0.15); color: var(--success); }
    .resp-status-4xx { background: rgba(232,124,124,0.15); color: var(--error); }
    .resp-status-5xx { background: rgba(232,124,124,0.2); color: #ff6b6b; }

    .resp-time { font-size: 12px; color: var(--text-muted); }

    .resp-actions { display: flex; gap: 8px; }
    .resp-view-btns { display: flex; gap: 4px; }

    .resp-view-btn {
      padding: 4px 10px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-muted);
      font-size: 11.5px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }

    .resp-view-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .resp-view-btn:hover:not(.active) { background: rgba(108,92,231,0.1); color: var(--text); }

    .copy-resp-btn {
      padding: 4px 10px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-muted);
      font-size: 11.5px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }

    .copy-resp-btn:hover { background: rgba(0,184,148,0.1); color: var(--success); }

    .resp-body {
      padding: 16px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 12.5px;
      line-height: 1.7;
      color: var(--text);
      overflow-x: auto;
      max-height: 420px;
      overflow-y: auto;
      white-space: pre;
    }

    .resp-body::-webkit-scrollbar { width: 4px; height: 4px; }
    .resp-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Syntax highlighting */
    .json-key  { color: #e06c75; }
    .json-str  { color: #98c379; }
    .json-num  { color: #d19a66; }
    .json-bool { color: #56b6c2; }
    .json-null { color: #abb2bf; }

    /* Possible responses */
    .possible-responses { display: flex; flex-direction: column; gap: 6px; }

    .possible-responses-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 4px;
    }

    .possible-response-item {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .possible-response-item summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      cursor: pointer;
      list-style: none;
      background: var(--bg);
      font-size: 12.5px;
      user-select: none;
      transition: background 0.1s;
    }

    .possible-response-item summary::-webkit-details-marker { display: none; }
    .possible-response-item[open] summary { background: rgba(45,61,97,0.5); }
    .possible-response-item summary:hover { background: rgba(45,61,97,0.4); }

    .resp-code-desc { flex: 1; font-size: 12px; color: var(--text-muted); }

    .expand-arrow { font-size: 10px; color: var(--text-muted); transition: transform 0.15s; }
    .possible-response-item[open] .expand-arrow { transform: rotate(90deg); }

    .possible-response-body {
      padding: 12px;
      background: var(--bg);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      line-height: 1.6;
      color: var(--text);
      border-top: 1px solid var(--border);
      overflow-x: auto;
      white-space: pre;
    }

    /* Status badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11.5px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .status-2xx { background: rgba(0,184,148,0.15); color: #00b894; }
    .status-4xx { background: rgba(232,124,124,0.15); color: #e87c7c; }
    .status-5xx { background: rgba(255,107,107,0.15); color: #ff6b6b; }

    /* Ep title */
    .ep-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ep-title-row h2 { font-size: 16px; font-weight: 700; color: var(--text); }

    .ep-desc { font-size: 13px; color: var(--text-muted); line-height: 1.6; }

    .ep-meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ep-meta-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 3px;
      background: rgba(45,61,97,0.7);
      color: var(--text-muted);
    }

    /* Spinner */

        + bodyPane
        + '</div></div>'
        + '<div class="resp-panel" id="resp-panel-' + ep.id + '"><div class="resp-topbar"><div class="resp-info"><span class="resp-status-badge" id="resp-status-' + ep.id + '">—</span><span class="resp-time" id="resp-time-' + ep.id + '"></span></div><div class="resp-actions"><div class="resp-view-btns"><button class="resp-view-btn active" id="view-pretty-' + ep.id + '" onclick="setRespView(\'' + ep.id + '\',\'pretty\')">Pretty</button><button class="resp-view-btn" id="view-raw-' + ep.id + '" onclick="setRespView(\'' + ep.id + '\',\'raw\')">Raw</button></div><button class="copy-resp-btn" onclick="copyResp(\'' + ep.id + '\')">Copy</button></div></div><div class="resp-body" id="resp-body-' + ep.id + '"></div></div>'
        + renderPossibleResponses(ep.possible_responses)
        + '</div>';

      main.innerHTML = html;
      updateUrlPreview(ep.id);

      // Wire up body enum chips after render
      if (hasBody && ep.body_enums) {
        Object.keys(ep.body_enums).forEach(function(fieldName) {
          // The body editor doesn't have a direct input; enums here are informational
          // They are handled in the param row setup for path/query params
        });
      }
    }

    // ─────────────────────────────────────────
    // TAB SWITCHING
    // ─────────────────────────────────────────
    function switchTab(epId, tabName, el) {
      var tabs = document.querySelectorAll('#req-tabs-' + epId + ' .req-tab');
      for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
      el.classList.add('active');
      var panes = document.querySelectorAll('#ep-panel-' + epId + ' .tab-pane');
      for (var j = 0; j < panes.length; j++) panes[j].classList.remove('active');
      var pane = document.getElementById('tab-' + epId + '-' + tabName);
      if (pane) pane.classList.add('active');
    }

    // ─────────────────────────────────────────
    // URL PREVIEW
    // ─────────────────────────────────────────
    function updateUrlPreview(epId) {
      var ep = ALL_ENDPOINTS.filter(function(e){ return e.id === epId; })[0];
      if (!ep) return;
      var path = ep.path;
      (ep.params || []).filter(function(p){ return p.location === 'path'; }).forEach(function(p) {
        var input = document.getElementById('param-' + epId + '-' + p.name);
        var val = input ? input.value.trim() : p.default;
        path = path.replace(':' + p.name, val ? encodeURIComponent(val) : (':' + p.name));
      });
      var qps = (ep.params || []).filter(function(p){ return p.location === 'query'; }).map(function(p) {
        var input = document.getElementById('param-' + epId + '-' + p.name);
        var val = input ? input.value.trim() : '';
        return val ? (p.name + '=' + encodeURIComponent(val)) : '';
      }).filter(Boolean);
      var full = 'https://api.pixel-pet-arena.com' + path;
      if (qps.length) full += '?' + qps.join('&');
      var preview = document.getElementById('url-preview-' + epId);
      if (preview) preview.textContent = full;
    }

    // ─────────────────────────────────────────
    // ENUM CHIP CLICK
    // ─────────────────────────────────────────
    function setParamEnum(epId, paramName, chipEl, val) {
      var input = document.getElementById('param-' + epId + '-' + paramName);
      if (input) {
        input.value = val;
        var siblings = chipEl.parentElement.querySelectorAll('.enum-chip');
        for (var i = 0; i < siblings.length; i++) siblings[i].classList.remove('selected');
        chipEl.classList.add('selected');
        updateUrlPreview(epId);
      }
    }

    // ─────────────────────────────────────────
    // SEND / RUN TRY
    // ─────────────────────────────────────────
    function runTry(epId) {
      var ep = ALL_ENDPOINTS.filter(function(e){ return e.id === epId; })[0];
      if (!ep) return;
      var btn = document.getElementById('send-btn-' + epId);
      btn.innerHTML = '<span class="spinner"></span> Sending';
      btn.classList.add('loading');
      var delay = 300 + Math.random() * 400;
      var t0 = Date.now();
      setTimeout(function() {
        try {
          // Collect params
          var params = {};
          (ep.params || []).forEach(function(p) {
            var input = document.getElementById('param-' + epId + '-' + p.name);
            params[p.name] = input ? input.value.trim() : (p.default || '');
          });
          // Collect token
          var tokenInput = document.getElementById('auth-token-' + epId);
          var token = tokenInput ? tokenInput.value.trim() : '';
          // Auth gate (strict required only)
          if (ep.auth_required && !ep.auth_optional && !token) {
            showResponse(epId, { status: 401, body: { success: false, data: null, error: { code: "UNAUTHORIZED", message: "Missing or invalid pet token." } } }, Date.now() - t0);
            btn.innerHTML = '<span>&#9654;</span> Send';
            btn.classList.remove('loading');
            return;
          }
          // Collect body
          var body = {};
          if (ep.body) {
            var textarea = document.getElementById('body-' + epId);
            if (textarea) {
              try { body = JSON.parse(textarea.value); }
              catch(e) {
                showResponse(epId, { status: 400, body: { success: false, data: null, error: { code: "VALIDATION_ERROR", message: "Request body is not valid JSON." } } }, Date.now() - t0);
                btn.innerHTML = '<span>&#9654;</span> Send';
                btn.classList.remove('loading');
                return;
              }
            }
          }
          var result = ep.mock_fn(params, body, token);
          showResponse(epId, result, Date.now() - t0);
        } catch(err) {
          showResponse(epId, { status: 500, body: { success: false, data: null, error: { code: "INTERNAL_SERVER_ERROR", message: err.message } } }, Date.now() - t0);
        }
        btn.innerHTML = '<span>&#9654;</span> Send';
        btn.classList.remove('loading');
      }, delay);
    }

    // ─────────────────────────────────────────
    // SHOW RESPONSE
    // ─────────────────────────────────────────
    function showResponse(epId, result, elapsed) {
      var panel = document.getElementById('resp-panel-' + epId);
      var statusEl = document.getElementById('resp-status-' + epId);
      var timeEl = document.getElementById('resp-time-' + epId);
      var bodyEl = document.getElementById('resp-body-' + epId);
      if (!panel) return;
      respData[epId] = result;
      panel.style.display = 'block';
      panel.classList.add('visible');
      var s = result.status;
      var cls = s >= 500 ? 'resp-status-5xx' : s >= 400 ? 'resp-status-4xx' : 'resp-status-2xx';
      statusEl.className = 'resp-status-badge ' + cls;
      statusEl.textContent = s + ' ' + httpStatusText(s);
      timeEl.textContent = elapsed + 'ms';
      bodyEl.innerHTML = syntaxHighlight(JSON.stringify(result.body, null, 2));
      // Ensure pretty view buttons reflect state
      var prettyBtn = document.getElementById('view-pretty-' + epId);
      var rawBtn = document.getElementById('view-raw-' + epId);
      if (prettyBtn) prettyBtn.classList.add('active');
      if (rawBtn) rawBtn.classList.remove('active');
    }

    function setRespView(epId, mode) {
      var prettyBtn = document.getElementById('view-pretty-' + epId);
      var rawBtn = document.getElementById('view-raw-' + epId);
      var bodyEl = document.getElementById('resp-body-' + epId);
      var data = respData[epId];
      if (!data || !bodyEl) return;
      if (prettyBtn) prettyBtn.classList.toggle('active', mode === 'pretty');
      if (rawBtn) rawBtn.classList.toggle('active', mode === 'raw');
      if (mode === 'pretty') {
        bodyEl.innerHTML = syntaxHighlight(JSON.stringify(data.body, null, 2));
      } else {
        bodyEl.textContent = JSON.stringify(data.body);
      }
    }

    function copyResp(epId) {
      var data = respData[epId];
      if (!data) return;
      copyText(JSON.stringify(data.body, null, 2));
    }

    // ─────────────────────────────────────────
    // HELPERS
    // ─────────────────────────────────────────
    function syntaxHighlight(json) {
      return json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function(match) {
        var cls = 'json-num';
        if (/^"/.test(match)) { cls = /:$/.test(match) ? 'json-key' : 'json-str'; }
        else if (/true|false/.test(match)) { cls = 'json-bool'; }
        else if (/null/.test(match)) { cls = 'json-null'; }
        return '<span class="' + cls + '">' + match + '</span>';
      });
    }

    function httpStatusText(s) {
      var m = { 200:'OK',201:'Created',202:'Accepted',400:'Bad Request',401:'Unauthorized',403:'Forbidden',404:'Not Found',408:'Request Timeout',409:'Conflict',429:'Too Many Requests',500:'Internal Server Error',503:'Service Unavailable' };
      return m[s] || '';
    }

    function toggleAuthVis(epId) {
      var input = document.getElementById('auth-token-' + epId);
      if (input) input.type = input.type === 'password' ? 'text' : 'password';
    }

    function addHeaderRow(epId) {
      var tbody = document.querySelector('#headers-table-' + epId + ' tbody');
      if (!tbody) return;
      var tr = document.createElement('tr');
      tr.innerHTML = '<td><input class="header-key-input" placeholder="Header-Name"></td><td><input class="header-val-input" placeholder="value"></td>';
      tbody.appendChild(tr);
    }

    function formatBody(epId) {
      var ta = document.getElementById('body-' + epId);
      if (!ta) return;
      try {
        ta.value = JSON.stringify(JSON.parse(ta.value), null, 2);
        var errEl = document.getElementById('json-err-' + epId);
        if (errEl) { errEl.textContent = ''; errEl.classList.remove('visible'); }
      } catch(e) { showToast('Invalid JSON — cannot format'); }
    }

    function validateJson(epId) {
      var ta = document.getElementById('body-' + epId);
      var errEl = document.getElementById('json-err-' + epId);
      if (!ta || !errEl) return;
      try { JSON.parse(ta.value); errEl.textContent = ''; errEl.classList.remove('visible'); }
      catch(e) { errEl.textContent = '&#9888; ' + e.message; errEl.classList.add('visible'); }
    }

    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function(){ showToast('Copied to clipboard'); }).catch(function(){ fallbackCopy(text); });
      } else { fallbackCopy(text); }
    }

    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast('Copied'); } catch(e) {}
      document.body.removeChild(ta);
    }

    // ─────────────────────────────────────────
    // BUILD CURL + COPY
    // ─────────────────────────────────────────
    function buildCurl(epId) {
      var ep = ALL_ENDPOINTS.filter(function(e){ return e.id === epId; })[0];
      if (!ep) return '';
      var authVal = (document.getElementById('auth-token-' + epId) || {}).value || '';
      var baseUrl = 'https://api.pixel-pet-arena.com';

      // Build path with path params substituted
      var path = ep.path;
      var queryPairs = [];
      (ep.params || []).forEach(function(p) {
        var input = document.getElementById('param-' + epId + '-' + p.name);
        var val = input ? input.value.trim() : (p.default || '');
        if (p.location === 'path') {
          path = path.replace(':' + p.name, val ? encodeURIComponent(val) : (':' + p.name));
        } else if (p.location === 'query' && val) {
          queryPairs.push(p.name + '=' + encodeURIComponent(val));
        }
      });

      var url = baseUrl + path + (queryPairs.length ? '?' + queryPairs.join('&') : '');
      var cmd = "curl -X " + ep.method + " '" + url + "'";
      if (authVal) cmd += " \\\n  -H 'Authorization: Bearer " + authVal + "'";
      cmd += " \\\n  -H 'Content-Type: application/json'";

      var bodyEl = document.getElementById('body-' + epId);
      if (bodyEl && bodyEl.value && ['POST','PUT','PATCH'].indexOf(ep.method) !== -1) {
        cmd += " \\\n  -d '" + bodyEl.value.replace(/'/g, "\\'") + "'";
      }
      return cmd;
    }

    function copyCurl(epId) {
      var cmd = buildCurl(epId);
      if (!cmd) { showToast('No endpoint selected'); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(cmd).then(function(){ showToast('cURL copied to clipboard'); }).catch(function(){ fallbackCopy(cmd); showToast('cURL copied'); });
      } else {
        fallbackCopy(cmd);
        showToast('cURL copied');
      }
    }

    var toastTimer = null;
    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('visible');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ t.classList.remove('visible'); }, 2000);
    }

    // ─────────────────────────────────────────
    // INIT
    // ─────────────────────────────────────────
    function initHash() {
      var hash = location.hash.replace('#', '');
      if (hash && ALL_ENDPOINTS.filter(function(e){ return e.id === hash; })[0]) {
        selectEndpoint(hash);
      } else {
        renderSidebar();
      }
    }

    renderSidebar();
    initHash();
    window.addEventListener('hashchange', initHash);
  </script>
</body>
</html>
