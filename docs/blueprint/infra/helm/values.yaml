# Generated by gendoc-gen-contracts from docs/EDD.md + docs/ARCH.md
# Project: pixel-pet-arena
# Purpose: Helm chart values — future k8s deployment
# EDD-PIXEL-PET-ARENA-20260503 | ARCH-PIXEL-PET-ARENA-20260503
#
# Resource limits derived from:
#   NORMAL_OPERATION_RPS=100, PEAK_OPERATION_RPS=500
#   PEAK_CONCURRENT_USERS=2000
#   DB_CONNECTION_POOL_MIN_CONNECTIONS=20
#   HORIZONTAL_SCALE_CPU_THRESHOLD_PERCENT=70
#   AVAILABILITY_MONTHLY_PERCENT=99.9%

# ---------------------------------------------------------------------------
# Global
# ---------------------------------------------------------------------------
global:
  nameOverride: pixel-pet-arena
  namespace: pixel-pet-arena
  image:
    registry: ""           # set to your container registry, e.g. ghcr.io/org
    pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# API service (Fastify 4 / Node.js 20 LTS)
# Sizing: sustain 100 RPS p99 <200 ms read / <500 ms write; burst to 500 RPS
# HPA scale-out at HORIZONTAL_SCALE_CPU_THRESHOLD_PERCENT=70
# ---------------------------------------------------------------------------
api:
  replicaCount: 2           # minimum for AVAILABILITY_MONTHLY_PERCENT=99.9%
  image:
    repository: pixel-pet-arena-api
    tag: latest

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10         # supports PEAK_OPERATION_RPS=500 with headroom
    targetCPUUtilizationPercentage: 70   # HORIZONTAL_SCALE_CPU_THRESHOLD_PERCENT

  # All secrets injected via Kubernetes Secret / external-secrets-operator
  # Never set plaintext credentials here; use secretKeyRef in deployment template
  env:
    NODE_ENV: production
    DB_POOL_MIN: "20"       # DB_CONNECTION_POOL_MIN_CONNECTIONS
    DB_POOL_MAX: "40"
    LEADERBOARD_UPDATE_LAG_MAX_SECONDS: "30"
    ARENA_RATE_LIMIT_BATTLES_PER_HOUR: "10"
    AUTH_RATE_LIMIT_CLAIM_ATTEMPTS_PER_HOUR: "5"
    AUTH_RATE_LIMIT_CODE_ENTRY_ATTEMPTS_PER_SESSION: "10"
    ADMIN_SESSION_INACTIVITY_EXPIRY_HOURS: "4"
    ADMIN_SESSION_ABSOLUTE_EXPIRY_HOURS: "8"
    TOKEN_ENTROPY_BYTES: "32"

  # Secret references (values populated by external-secrets / sealed-secrets)
  secretEnv:
    DATABASE_URL:
      secretName: pixel-pet-arena-db
      key: url
    REDIS_URL:
      secretName: pixel-pet-arena-redis
      key: url
    SENDGRID_API_KEY:
      secretName: pixel-pet-arena-email
      key: sendgrid_api_key
    EMAIL_ENCRYPTION_KEY:
      secretName: pixel-pet-arena-email
      key: aes_key

  readinessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

  livenessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 30
    failureThreshold: 3

  podDisruptionBudget:
    enabled: true
    minAvailable: 1         # ensures 99.9% availability during rolling deploys

# ---------------------------------------------------------------------------
# PostgreSQL (durable store — ARCH §1.1 P2)
# DB_AUTOFAILOVER_TIME_SECONDS=60 → use HA chart (e.g. bitnami/postgresql-ha)
# for production; single-instance config shown here for staging/dev-cluster
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  image:
    tag: "15"

  auth:
    # Credentials injected from Kubernetes Secret — do not set values here
    existingSecret: pixel-pet-arena-db
    secretKeys:
      adminPasswordKey: postgres_password
      userPasswordKey: user_password

  primary:
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
    persistence:
      enabled: true
      size: 20Gi
    # Connection pool ceiling aligned to api.env.DB_POOL_MAX=40 × maxReplicas=10
    extendedConfiguration: |
      max_connections = 500
      shared_buffers = 256MB
      work_mem = 4MB

# ---------------------------------------------------------------------------
# Redis (leaderboard sorted set + rate-limit counters — ARCH §1.1 P2)
# Fail-closed on OTP code entry if Redis unavailable (ARCH §1.1 P5)
# LEADERBOARD_UPDATE_LAG_MAX_SECONDS=30
# ---------------------------------------------------------------------------
redis:
  enabled: true
  image:
    tag: "7"

  auth:
    enabled: true
    existingSecret: pixel-pet-arena-redis
    existingSecretPasswordKey: password

  master:
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
    persistence:
      enabled: true
      size: 2Gi
    configuration: |
      appendonly yes
      maxmemory 200mb
      maxmemory-policy allkeys-lru

  replica:
    replicaCount: 1         # standby replica for availability

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
  hosts:
    - host: ""              # set to your domain, e.g. api.pixel-pet-arena.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: pixel-pet-arena-tls
      hosts:
        - ""                # match host above

# ---------------------------------------------------------------------------
# Namespace
# ---------------------------------------------------------------------------
namespace:
  create: true
  name: pixel-pet-arena
