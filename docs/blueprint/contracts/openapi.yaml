          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: from
          in: query
          description: Start of date range (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: End of date range (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: actorId
          in: query
          description: Filter by admin account ID
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          description: Filter by action type (e.g. pet.ban)
          schema:
            type: string
      responses:
        '200':
          description: Paginated audit log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      entries:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditLogEntry'
                  error:
                    nullable: true
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

