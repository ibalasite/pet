<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics · Pixel Pet Arena Admin</title>
  <link rel="stylesheet" href="assets/admin-style.css" />
  <style>
    .chart-container { margin-bottom: 24px; }
    .chart-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--admin-text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
    .chart-wrap { background: var(--admin-surface); border: 1px solid var(--admin-border); border-radius: var(--radius-md); padding: 20px 24px 12px; position: relative; height: 180px; }
    .chart-svg { width: 100%; height: 100%; overflow: visible; }
    .chart-line { fill: none; stroke: var(--admin-accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .chart-area { fill: url(#areaGrad); opacity: 0.25; }
    .chart-dot { fill: var(--admin-accent); }
    .chart-label { font-size: 10px; fill: var(--admin-text-dim); }
    .funnel-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .funnel-label { width: 120px; font-size: 13px; color: var(--admin-text-dim); text-align: right; }
    .funnel-bar-wrap { flex: 1; background: var(--admin-surface-2); border-radius: 4px; height: 28px; overflow: hidden; }
    .funnel-bar { height: 100%; background: var(--admin-accent); border-radius: 4px; display: flex; align-items: center; padding: 0 10px; font-size: 12px; font-weight: 600; color: #fff; transition: width 0.6s ease; }
    .chart-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .chart-tab { padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid var(--admin-border); background: var(--admin-surface); color: var(--admin-text-dim); }
    .chart-tab.active { background: var(--admin-accent); border-color: var(--admin-accent); color: #fff; }
  </style>
</head>
<body>
<header class="admin-topnav">
  <a href="../../../index.html" class="back-link">← 文件站</a>
  <span class="topnav-title">🛡️ Pixel Pet Arena Admin</span>
  <div class="topnav-right">
    <span class="current-user" id="currentUserLabel"></span>
    <button class="logout-btn" id="logoutBtnAnalytics">登出</button>
  </div>
</header>
<div id="sidebarContainer"></div>

<main class="admin-main">
  <div class="page-header">
    <h1 class="page-title">📈 Analytics</h1>
    <span class="page-subtitle">過去 30 天時序指標</span>
  </div>

  <div class="chart-tabs">
    <span class="chart-tab active" onclick="showChart('dau', this)">DAU</span>
    <span class="chart-tab" onclick="showChart('claims', this)">Claim 漏斗</span>
    <span class="chart-tab" onclick="showChart('battles', this)">戰鬥趨勢</span>
    <span class="chart-tab" onclick="showChart('leaderboard', this)">Leaderboard UV</span>
    <span class="chart-tab" onclick="showChart('email', this)">Email 成功率</span>
  </div>

  <div id="chartDau" class="chart-container">
    <div class="chart-title">DAU — 每日活躍用戶（過去 30 天）</div>
    <div class="chart-wrap"><svg class="chart-svg" id="svgDau"></svg></div>
  </div>

  <div id="chartClaims" class="chart-container" style="display:none;">
    <div class="chart-title">Claim 漏斗</div>
    <div class="panel" style="padding:20px;">
      <div id="funnelContainer"></div>
    </div>
  </div>

  <div id="chartBattles" class="chart-container" style="display:none;">
    <div class="chart-title">戰鬥數趨勢（過去 30 天）</div>
    <div class="chart-wrap"><svg class="chart-svg" id="svgBattles"></svg></div>
  </div>

  <div id="chartLeaderboard" class="chart-container" style="display:none;">
    <div class="chart-title">Leaderboard UV（過去 30 天）</div>
    <div class="chart-wrap"><svg class="chart-svg" id="svgLeaderboard"></svg></div>
  </div>

  <div id="chartEmail" class="chart-container" style="display:none;">
    <div class="chart-title">SendGrid 發信成功率（過去 30 天）</div>
    <div class="chart-wrap"><svg class="chart-svg" id="svgEmail"></svg></div>
  </div>
</main>

<script src="assets/admin-mock.js"></script>
<script>
  /* Generate deterministic mock time-series */
  function makeSeries(base, variance, n) {
    var out = [];
    var v = base;
    for (var i = 0; i < n; i++) {
      v = Math.max(base * 0.5, Math.min(base * 1.5, v + (Math.random() - 0.5) * variance));
      out.push(Math.round(v));
    }
    return out;
  }

  var N = 30;
  var DATA = {
    dau:         makeSeries(4200, 400, N),
    battles:     makeSeries(8500, 900, N),
    leaderboard: makeSeries(1200, 150, N),
    email:       makeSeries(99,   1.5, N),
  };

  var FUNNEL = [
    { label: 'Visits',       value: 18400, pct: 100  },
    { label: 'Email submit', value: 11200, pct: 60.9 },
    { label: 'Code verify',  value:  7800, pct: 42.4 },
    { label: 'Claim',        value:  5100, pct: 27.7 },
  ];

  /* roleDisplayName is provided by admin-mock.js window.roleDisplayName */

  /* Safe navigation allowlist */
  var SAFE_PAGES = { 'admin-login.html': 'admin-login.html' };
  function safeNav(page) { var t = SAFE_PAGES[page]; if (t) { location.href = t; } }

  function init() {
    var u = ADMIN_MOCK.currentUser;
    var labelEl = document.getElementById('currentUserLabel');
    if (labelEl) { labelEl.textContent = u.username + ' (' + roleDisplayName(u.role) + ')'; }

    /* Sidebar: renderSidebar() returns HTMLElement — use replaceWith(), not innerHTML */
    var sidebar = document.getElementById('sidebarContainer');
    if (sidebar) { sidebar.replaceWith(renderSidebar('analytics')); }

    renderLineSVG('svgDau',         DATA.dau,         '#6c5ce7');
    renderLineSVG('svgBattles',     DATA.battles,     '#00b894');
    renderLineSVG('svgLeaderboard', DATA.leaderboard, '#fdcb6e');
    renderLineSVG('svgEmail',       DATA.email,       '#74b9ff');
    renderFunnel();
  }

  function renderLineSVG(svgId, series, color) {
    var el = document.getElementById(svgId);
    if (!el || series.length === 0) { return; }
    var w = 800; var h = 130;
    var minV = series.reduce(function (a, b) { return a < b ? a : b; }, series[0]);
    var maxV = series.reduce(function (a, b) { return a > b ? a : b; }, series[0]);
    var range = maxV - minV || 1;
    var pad = { top: 10, right: 10, bottom: 24, left: 40 };
    var iw = w - pad.left - pad.right;
    var ih = h - pad.top - pad.bottom;
    /* avoid divide-by-zero when series has a single point */
    var xDenom = series.length > 1 ? series.length - 1 : 1;

    function px(i) { return pad.left + (i / xDenom) * iw; }
    function py(v) { return pad.top + ih - ((v - minV) / range) * ih; }

    var pts = series.map(function (v, i) { return px(i) + ',' + py(v); }).join(' ');
    var areaClose = px(series.length - 1) + ',' + (pad.top + ih) + ' ' + px(0) + ',' + (pad.top + ih);

    var axisLabels = '';
    var step = Math.max(1, Math.floor((series.length - 1) / 5));
    for (var i = 0; i < series.length; i += step) {
      axisLabels += '<text class="chart-label" x="' + px(i) + '" y="' + (h - 4) + '" text-anchor="middle">d-' + (series.length - 1 - i) + '</text>';
    }

    var yLabels = '<text class="chart-label" x="' + (pad.left - 4) + '" y="' + (pad.top + 4) + '" text-anchor="end">' + maxV + '</text>'
      + '<text class="chart-label" x="' + (pad.left - 4) + '" y="' + (pad.top + ih) + '" text-anchor="end">' + minV + '</text>';

    el.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    el.innerHTML = '<defs><linearGradient id="ag' + svgId + '" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0%" stop-color="' + color + '" stop-opacity="0.5"/>'
      + '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/>'
      + '</linearGradient></defs>'
      + '<polyline class="chart-area" points="' + pts + ' ' + areaClose + '" style="fill:url(#ag' + svgId + ');" />'
      + '<polyline class="chart-line" points="' + pts + '" style="stroke:' + color + ';"/>'
      + axisLabels + yLabels;
  }

  function renderFunnel() {
    var container = document.getElementById('funnelContainer');
    if (!container) { return; }
    container.textContent = '';  /* clear */
    FUNNEL.forEach(function (f) {
      var row      = document.createElement('div'); row.className = 'funnel-row';
      var lbl      = document.createElement('div'); lbl.className = 'funnel-label'; lbl.textContent = f.label;
      var barWrap  = document.createElement('div'); barWrap.className = 'funnel-bar-wrap';
      var bar      = document.createElement('div'); bar.className = 'funnel-bar';
      bar.style.width    = f.pct + '%';
      bar.textContent    = f.value.toLocaleString();
      var pctDiv   = document.createElement('div');
      pctDiv.style.cssText = 'width:48px;text-align:right;font-size:12px;color:var(--admin-text-dim)';
      pctDiv.textContent   = f.pct + '%';
      barWrap.appendChild(bar);
      row.appendChild(lbl); row.appendChild(barWrap); row.appendChild(pctDiv);
      container.appendChild(row);
    });
  }

  function showChart(key, tabEl) {
    var map = { dau: 'chartDau', claims: 'chartClaims', battles: 'chartBattles', leaderboard: 'chartLeaderboard', email: 'chartEmail' };
    Object.keys(map).forEach(function (k) {
      var el = document.getElementById(map[k]);
      if (el) { el.style.display = k === key ? 'block' : 'none'; }
    });
    document.querySelectorAll('.chart-tab').forEach(function (t) { t.classList.remove('active'); });
    if (tabEl) { tabEl.classList.add('active'); }
  }

  document.addEventListener('DOMContentLoaded', function () {
    init();
    var logoutBtn = document.getElementById('logoutBtnAnalytics');
    if (logoutBtn) { logoutBtn.addEventListener('click', function () { safeNav('admin-login.html'); }); }
  });
</script>
</body>
</html>
