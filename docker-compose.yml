# Generated by gendoc-gen-contracts from docs/EDD.md
# Project: pixel-pet-arena
# Deploy target: docker-compose (DEPLOY_TARGET=docker)
# Lang stack: Node.js 20 LTS + Fastify 4
# EDD-PIXEL-PET-ARENA-20260503 | ARCH-PIXEL-PET-ARENA-20260503

version: '3.8'

services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # Dual-store authority: PostgreSQL durable store (ARCH §1.1 P2)
      # Credentials injected from .env — never hardcode in version control
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Connection pool floor: DB_CONNECTION_POOL_MIN_CONNECTIONS=20
      - DB_POOL_MIN=20
      - DB_POOL_MAX=40
      # Dual-store authority: Redis real-time leaderboard + rate-limit counters (ARCH §1.1 P2)
      - REDIS_URL=redis://redis:6379
      # LEADERBOARD_UPDATE_LAG_MAX_SECONDS=30
      - LEADERBOARD_UPDATE_LAG_MAX_SECONDS=30
      # Email: SendGrid primary; Nodemailer SMTP fallback after SENDGRID_FAILOVER_CONSECUTIVE_FAILURES=3
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      # Arena rate limits (ARENA_RATE_LIMIT_BATTLES_PER_HOUR_DEFAULT=10)
      - ARENA_RATE_LIMIT_BATTLES_PER_HOUR=10
      # Auth rate limits
      - AUTH_RATE_LIMIT_CLAIM_ATTEMPTS_PER_HOUR=5
      - AUTH_RATE_LIMIT_CODE_ENTRY_ATTEMPTS_PER_SESSION=10
      # Admin session security
      - ADMIN_SESSION_INACTIVITY_EXPIRY_HOURS=4
      - ADMIN_SESSION_ABSOLUTE_EXPIRY_HOURS=8
      # GDPR email encryption key (AES-256-GCM — override in production via secrets manager)
      - EMAIL_ENCRYPTION_KEY=${EMAIL_ENCRYPTION_KEY:-}
      # JWT/token entropy: PET_ACCESS_TOKEN_MIN_BYTES=32, CLAIM_TOKEN_MIN_ENTROPY_BYTES=32
      - TOKEN_ENTROPY_BYTES=32
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - DB_POOL_MIN=5
      - DB_POOL_MAX=10
      - REDIS_URL=redis://redis:6379
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - EMAIL_ENCRYPTION_KEY=${EMAIL_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      # Credentials injected from .env — never hardcode in version control
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # DB_AUTOFAILOVER_TIME_SECONDS=60 — managed at infra level; healthcheck ensures container readiness
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pixel_pet_arena"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # LEADERBOARD_UPDATE_LAG_MAX_SECONDS=30: Redis is authoritative for leaderboard sorted sets
    # and rate-limit counters; graceful degradation to PostgreSQL on unavailability (ARCH §1.1 P2)
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Development only: MailHog captures outbound email (SendGrid fallback SMTP path)
  # Remove or replace with real SMTP in staging/production
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP — matches SMTP_HOST/SMTP_PORT env vars in api service
      - "8025:8025"   # MailHog Web UI
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
